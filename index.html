}
function aplicarAdiar(id, d) {
  const it = S.db.itens.find(x => x.id === id);
  const aviso = it.data && d > it.data && it.planejado ? ` Atenção: fica depois do prazo (${fdia(it.data)}).` : '';
  moverItem(it, d, 'adiado'); render(); fecharModal(); toast(`Adiado para ${frel(d)}.${aviso}`, aviso ? 4500 : 2600);
}

/* ===================== PLANEJADOR ===================== */
const fl = x => Math.floor(x * 2 + 1e-9) / 2; // arredonda para baixo em meias horas
const ce = x => Math.ceil(x * 2 - 1e-9) / 2;

// "Não consegui": dias com espaço ANTES do prazo
function sugestoes(it) {
  const h = num(it.horas); const ini = addDias(hoje(), 1);
  let lim = it.data ? it.data : addDias(ini, 30);
  const semPrazo = !it.data;
  if (lim < ini) return { h, vencido: true, cabem: [], livre: {}, total: 0, lim };
  const livre = livreMapa(ini, lim, new Set([it.id]));
  const dias = Object.keys(livre).sort();
  const cabem = dias.filter(d => livre[d] >= h - 1e-9).slice(0, 6);
  const total = dias.reduce((s, d) => s + Math.max(0, fl(livre[d])), 0);
  return { h, cabem, livre, dias, total, lim, semPrazo };
}
function naoConsegui(id) {
  const it = S.db.itens.find(x => x.id === id); const s = sugestoes(it);
  let html = `${cab('Não consegui — replanejar')}<p style="margin-top:0;color:var(--txt2)"><b>${esc(it.titulo)}</b> · ${s.h ? fh(s.h) : 'sem tempo estimado'}${it.data ? ' · prazo ' + fdia(it.data) : ' · sem prazo (procurando nos próximos 30 dias)'}</p>`;
  if (s.vencido) {
    html += `<div class="alerta verm"><b>O prazo (${fdia(it.data)}) já passou ou é hoje.</b> Não há nenhum dia antes do prazo. Escolha uma nova data (isso muda o prazo) ou fale com quem definiu o prazo.</div>`;
  } else if (s.cabem.length) {
    html += `<div class="alerta verde">Estes dias têm espaço livre suficiente${it.data ? ' antes do prazo' : ''}. Toque para aceitar:</div>`;
    html += s.cabem.map(d => `<div class="sug"><div class="info"><b>${DSEM_LONGO[dsem(d)]}, ${fdm(d)}</b><small>livre ${fh(s.livre[d])} → sobra ${fh(s.livre[d] - s.h)}${d === it.data ? ' · é o dia do prazo' : ''}</small></div><button class="btn pri peq" data-a="moverPara" data-id="${id}" data-v="${d}">Aceitar</button></div>`).join('');
  } else {
    html += `<div class="alerta verm"><b>Não cabe inteiro em nenhum dia${it.data ? ' antes do prazo (' + fdia(it.data) + ')' : ' dos próximos 30 dias'}.</b><br>Espaço livre somando todos os dias: ${fh(s.total)} · precisa de ${fh(s.h)}.</div>`;
    if (s.total >= s.h - 1e-9 && s.h > 0) {
      const partes = dividir(s, s.h);
      html += `<div class="alerta amar">Dá para fazer em partes:<br>${partes.map(p => `• ${fdia(p.d)} — ${fh(p.h)}`).join('<br>')}</div><button class="btn pri bloco" data-a="aplicarDivisao" data-id="${id}">Dividir assim</button>`;
    } else if (s.h > 0) {
      html += `<div class="alerta verm">Mesmo dividindo, faltam <b>${fh(s.h - s.total)}</b>. Opções: aumentar horas de algum dia, reduzir o tempo estimado, ou negociar o prazo.</div>`;
    }
    const melhor = (s.dias || []).slice().sort((a, b) => s.livre[b] - s.livre[a])[0];
    if (melhor) html += `<button class="btn bloco" style="margin-top:8px" data-a="moverPara" data-id="${id}" data-v="${melhor}">Colocar mesmo assim no dia mais livre (${fdia(melhor)})</button>`;
  }
  html += `<form data-form="adiarData" data-id="${id}" style="display:flex;gap:8px;margin-top:14px"><input class="inp" type="date" name="d" required min="${hoje()}" style="flex:1;margin:0"><button class="btn" type="submit">Escolher data</button></form>`;
  abrirModal(html);
}
function dividir(s, h) {
  const partes = []; let resto = h;
  for (const d of s.dias) { if (resto <= 1e-9) break; const liv = fl(Math.max(0, s.livre[d])); if (liv < 0.5) continue; const x = Math.min(liv, resto); partes.push({ d, h: x }); resto -= x; }
  return partes;
}
function aplicarDivisao(id) {
  const it = S.db.itens.find(x => x.id === id); const s = sugestoes(it); const partes = dividir(s, s.h); const n = partes.length;
  const serie = it.id; const base = it.titulo.replace(/ \(parte \d+\/\d+\)$/, '');
  partes.forEach((p, i) => {
    const o = i === 0 ? { ...it } : { ...it, id: uid(), checklist: [], historico: [], adiamentos: 0, criado: new Date().toISOString() };
    o.titulo = `${base} (parte ${i + 1}/${n})`; o.horas = p.h; o.planejado = p.d; o.divisao = serie;
    if (i === 0) o.historico = [...(it.historico || []), { de: dia(it), para: p.d, em: hoje(), tipo: 'nao-consegui' }];
    if (!o.data) o.data = null;
    if (o.data === o.planejado) o.planejado = null;
    salvar('itens', o, true);
  });
  render(); fecharModal(); toast(`Dividido em ${n} partes.`);
}

// distribui um conjunto de itens nos próximos dias, respeitando horas livres e prazos
function planejarLote(itens, ini) {
  const fim = addDias(ini, 60); const ex = new Set(itens.map(i => i.id));
  const livre = livreMapa(ini, fim, ex);
  const ord = itens.slice().sort((a, b) => (a.data || '9999').localeCompare(b.data || '9999') || (PESO_PRIO[a.prioridade] ?? 1) - (PESO_PRIO[b.prioridade] ?? 1) || num(b.horas) - num(a.horas));
  const res = ord.map(it => {
    const h = num(it.horas);
    const temPrazo = (it.tipo === 'tarefa' || it.tipo === 'prazo') && it.data; // mensagem/compromisso: a data é "quando", não um prazo
    if (temPrazo && it.data < ini) return { it, d: null, motivo: it.data === hoje() ? 'o prazo vence hoje' : `o prazo (${fdia(it.data)}) já passou` };
    const lim = temPrazo ? it.data : fim;
    for (let d = ini; d <= lim; d = addDias(d, 1)) if (livre[d] >= h - 1e-9) { livre[d] -= h; return { it, d }; }
    return { it, d: null, motivo: `não cabe antes do prazo (${fdia(lim)})` };
  });
  // sugestão "mesmo assim": dia mais livre nas próximas 2 semanas (mudando o prazo se preciso)
  for (const p of res) if (!p.d) { let m = null; for (let d = ini; d <= addDias(ini, 13); d = addDias(d, 1)) if (m === null || livre[d] > livre[m] + 1e-9) m = d; p.forcar = m; livre[m] -= num(p.it.horas); }
  return res;
}
function previaLote(itens, ini, titulo, intro) {
  const plano = planejarLote(itens, ini); S.tmp.lote = plano;
  const ok = plano.filter(p => p.d), nao = plano.filter(p => !p.d);
  abrirModal(`${cab(titulo)}${intro ? `<p style="margin-top:0;color:var(--txt2)">${intro}</p>` : ''}
    ${ok.length ? `<table class="tab"><tr><th>Item</th><th>Horas</th><th>Novo dia</th></tr>${ok.map(p => `<tr><td>${esc(p.it.titulo)}</td><td>${num(p.it.horas) ? fh(p.it.horas) : '—'}</td><td><b>${fdia(p.d)}</b></td></tr>`).join('')}</table>` : ''}
    ${nao.length ? `<div class="alerta verm"><b>${nao.length} item(ns) não couberam antes do prazo:</b><br>${nao.map(p => `• ${esc(p.it.titulo)} (${fh(p.it.horas)}) — ${p.motivo}`).join('<br>')}</div>
      <label class="check-linha"><input type="checkbox" id="forcar"><span class="txt">Mover esses também para o dia mais livre, mesmo passando do prazo/da capacidade (${nao.map(p => fdia(p.forcar)).join(', ')})</span></label>
      <p class="vazio">Se deixar desmarcado, eles ficam onde estão — use “Não consegui” neles para dividir em partes ou escolher outra data.</p>` : ''}
    ${!plano.length ? '<div class="vazio">Nada para replanejar. 👏</div>' : ''}
    <div class="linha-btns" style="margin-top:12px">${plano.length ? `<button class="btn pri" style="flex:1" data-a="aplicarLote">Aplicar</button>` : ''}<button class="btn" data-a="fechar">Cancelar</button></div>`);
}
function aplicarLote() {
  const plano = S.tmp.lote || []; let n = 0; const forcar = $('#forcar')?.checked;
  for (const p of plano) { if (!p.d && forcar) p.d = p.forcar; }
  for (const p of plano) if (p.d) { const it = S.db.itens.find(x => x.id === p.it.id); if (it) { moverOuPlanejar(it, p.d); n++; } }
  render(); fecharModal(); toast(`${n} item(ns) replanejado(s).`);
}
function moverOuPlanejar(it, d) {
  // para tarefas com prazo, define o "fazer em"; para o resto, move a data
  if ((it.tipo === 'tarefa' || it.tipo === 'prazo') && it.data && d <= it.data) {
    salvar('itens', { ...it, planejado: d === it.data ? null : d, historico: [...(it.historico || []), { de: dia(it), para: d, em: hoje(), tipo: 'replanejado' }], adiamentos: (it.adiamentos || 0) + (dia(it) && dia(it) < d ? 1 : 0) }, true);
  } else moverItem(it, d, 'replanejado');
}
const pendentesRevisao = () => itensVis().filter(it => !it.feito && dia(it) && dia(it) <= hoje());

VIEWS.revisao = () => {
  const ps = ordenar(pendentesRevisao());
  return `<h2 class="tit"><button class="icone-btn" data-a="ir" data-v="planejador">‹</button> O que ficou pendente? <span class="sub">${nomeAba()}</span></h2>
  <div class="card"><p style="margin-top:0">Revise o dia: marque o que fez, e o que não deu, replaneje.</p>
  <button class="btn pri bloco" data-a="replanejarTudo" ${ps.length ? '' : 'disabled'}>Replanejar tudo de uma vez (${ps.length})</button></div>
  <div class="card">${ps.length ? ps.map(it => `${cardItem(it, { mostrarData: true })}<div class="linha-btns" style="padding:0 0 10px 40px"><button class="btn ok peq" data-a="feito" data-id="${it.id}">Fiz</button><button class="btn peq" data-a="naoConsegui" data-id="${it.id}">Não consegui</button><button class="btn peq" data-a="adiarPara" data-id="${it.id}" data-v="${addDias(hoje(), 1)}">Amanhã</button></div>`).join('') : '<div class="vazio">Nada pendente. Dia fechado! 🎉</div>'}</div>`;
};

VIEWS.planejador = () => {
  const h = hoje(); const fim = addDias(h, 13); const carga = cargaMapa(h, fim);
  const seg = segundaDe(h), dom = addDias(seg, 6); const cs = cargaMapa(seg, dom);
  let planSem = 0, dispSem = 0; for (let d = seg; d <= dom; d = addDias(d, 1)) { planSem += cs[d]?.t || 0; dispSem += disponivel(d); }
  const estourados = []; for (let d = h; d <= fim; d = addDias(d, 1)) if ((carga[d]?.t || 0) > disponivel(d) + 1e-9) estourados.push(d);
  const aPlanejar = itensVis().filter(it => !it.feito && (it.tipo === 'tarefa' || it.tipo === 'prazo') && num(it.horas) > 0 && !it.planejado && (!it.data || it.data >= h));
  const pend = pendentesRevisao().length;
  let html = `<h2 class="tit">Planejador <span class="sub">horas livres são compartilhadas entre Pessoal e Trabalho</span></h2>
  <div class="kpis"><div class="kpi"><div class="v" style="color:${planSem > dispSem ? 'var(--verm)' : 'inherit'}">${fh(planSem)}</div><div class="l">planejadas nesta semana de ${fh(dispSem)}</div></div>
  <div class="kpi"><div class="v" style="color:${estourados.length ? 'var(--verm)' : 'var(--verde)'}">${estourados.length}</div><div class="l">dia(s) estourado(s) em 14 dias</div></div>
  <div class="kpi"><div class="v">${aPlanejar.length}</div><div class="l">tarefa(s) sem dia planejado</div></div>
  <div class="kpi"><div class="v" style="color:${pend ? 'var(--verm)' : 'inherit'}">${pend}</div><div class="l">pendente(s) de hoje/atrás</div></div></div>
  <div class="linha-btns" style="margin-bottom:14px"><button class="btn pri" data-a="revisao">Revisão do dia</button><button class="btn" data-a="novaMeta">🎯 Meta para prova</button><button class="btn" data-a="ir" data-v="resumo">Resumo da semana</button><button class="btn" data-a="ir" data-v="ajustes">Minhas horas</button></div>`;
  if (estourados.length) html += `<div class="alerta verm">Dias com mais do que cabe: ${estourados.map(d => `<a href="#" data-a="diaPlan" data-v="${d}">${fdia(d)}</a>`).join(', ')}. Toque no dia e use “Não consegui” nos itens de menor prioridade.</div>`;
  html += `<div class="card"><h3>Próximos 14 dias ${num(AJ().folga) ? `<span class="cont">${AJ().folga}% de reserva</span>` : ''}</h3>`;
  for (let d = h; d <= fim; d = addDias(d, 1)) {
    const cheio = (carga[d]?.t || 0) > disponivel(d) + 1e-9;
    html += `<div class="dia-plan ${d === h ? 'hoje' : ''} ${cheio ? 'excedido' : ''}" data-a="diaPlan" data-v="${d}"><div class="dn">${d === h ? 'Hoje' : DSEM[dsem(d)]}<small>${fdm(d)}</small></div><div>${barraDia(d, carga)}</div></div>`;
  }
  html += `</div>`;
  html += `<div class="card"><h3>Tarefas sem dia planejado <span class="cont">${aPlanejar.length}</span></h3>${lista(ordenar(aPlanejar), { mostrarData: true, vazio: 'Todas as tarefas com tempo estimado já têm dia.' })}
    ${aPlanejar.length ? `<button class="btn pri bloco" style="margin-top:10px" data-a="encaixar">Planejar automaticamente</button>` : ''}</div>
    <p class="vazio">Regras usadas: o sistema ocupa primeiro os dias mais próximos com espaço, nunca passa do prazo, respeita as horas livres de cada dia menos a folga, e ordena por prazo → prioridade → tamanho.</p>`;
  return html;
};
function diaPlan(d) {
  const xs = itensDoDia(d).filter(x => !x.prazoAqui);
  abrirModal(`${cab(DSEM_LONGO[dsem(d)] + ', ' + fdata(d))}${barraDia(d, cargaMapa(d, d))}
    <div style="margin-top:8px">${xs.length ? xs.map(x => cardItem(x.it, { virtual: x.virtual }) + (!x.it.feito && !x.virtual ? `<div class="linha-btns" style="padding:0 0 8px 40px"><button class="btn peq" data-a="naoConsegui" data-id="${x.it.id}">Não consegui / mover</button></div>` : '')).join('') : '<div class="vazio">Nada planejado.</div>'}</div>
    <div class="linha-btns" style="margin-top:12px"><button class="btn pri" data-a="novo" data-dia="${d}">+ Item neste dia</button><button class="btn" data-a="horasDia" data-v="${d}">Horas deste dia</button></div>`);
}
function horasDia(d) {
  const a = AJ(); const temExc = a.excecoes[d] != null;
  const det = (a.excDetalhe || {})[d] || (temExc ? { acordo: '07:00', durmo: '22:00', ocupado: Math.max(0, 15 - num(a.excecoes[d])) } : detDia(dsem(d)));
  abrirModal(`${cab('Horas de ' + fdia(d))}
  <form data-form="horasDia" data-v="${d}" data-calc>
  <p class="vazio" style="margin-top:-4px">Só para este dia. O padrão de ${DSEM_LONGO[dsem(d)].toLowerCase()} é ${fh(a.semana[dsem(d)])} livres.</p>
  ${blocoDia('x', det, DSEM_LONGO[dsem(d)] + ' ' + fdm(d))}
  ${num(a.folga) ? `<p class="vazio">Com a reserva de ${a.folga}% para imprevistos, o planejador usa um pouco menos que isso.</p>` : ''}
  <div class="linha-btns" style="margin-top:12px"><button class="btn pri" type="submit" style="flex:1">Salvar</button>${temExc ? `<button class="btn" type="button" data-a="removerExc" data-v="${d}">Voltar ao padrão</button>` : ''}</div></form>`);
}
const minutos = t => { if (!t) return null; const [hh, mm] = t.split(':').map(Number); return hh * 60 + (mm || 0); };
function calcLivres(acordo, durmo, ocupado) {
  const a = minutos(acordo), b = minutos(durmo); if (a == null || b == null) return 0;
  let dur = (b - a) / 60; if (dur <= 0) dur += 24; // dormir depois da meia-noite
  return Math.max(0, Math.round((dur - num(ocupado)) * 4) / 4);
}
function detDia(i) {
  const a = AJ(); const d = (a.detalhe || [])[i];
  if (d) return d;
  return { acordo: '07:00', durmo: '22:00', ocupado: Math.max(0, 15 - num(a.semana[i])) }; // equivale às horas já salvas
}
function blocoDia(p, det, nome) {
  const liv = calcLivres(det.acordo, det.durmo, det.ocupado);
  return `<div class="bloco-dia" data-bloco="${p}"><div class="bd-nome">${nome}<span class="bd-res" data-res="${p}">${fh(liv)} livres</span></div>
    <div class="bd-campos"><label class="campo">Acordo<input type="time" name="${p}_a" value="${det.acordo}"></label>
    <label class="campo">Durmo<input type="time" name="${p}_d" value="${det.durmo}"></label>
    <label class="campo">Ocupado (horas)<input type="number" step="0.5" min="0" max="24" name="${p}_o" value="${det.ocupado}" inputmode="decimal"></label></div></div>`;
}
function lerBloco(dados, p) { const det = { acordo: dados[p + '_a'] || '07:00', durmo: dados[p + '_d'] || '22:00', ocupado: num(dados[p + '_o']) }; return { det, livres: calcLivres(det.acordo, det.durmo, det.ocupado) }; }
function atualizarCalc(f) {
  const d = dadosForm(f);
  f.querySelectorAll('[data-res]').forEach(el => { const r = lerBloco(d, el.dataset.res); el.textContent = fh(r.livres) + ' livres'; });
}

  abrirModal(`${cab(meta ? 'Replanejar meta' : '🎯 Meta para prova')}
  <form data-form="meta" data-id="${meta?.id || ''}">
    <label class="campo">Nome da prova<input name="nome" required value="${esc(m.nome)}" placeholder="Ex.: P2 Circuitos Elétricos"></label>
    <div class="campos2"><label class="campo">Data da prova<input type="date" name="dataProva" required value="${m.dataProva}" min="${addDias(hoje(), 1)}"></label>
    <label class="campo">Começar a estudar em<input type="date" name="inicio" required value="${m.inicio < hoje() ? hoje() : m.inicio}" min="${hoje()}"></label></div>
    <label class="campo">Máximo de horas do mesmo assunto por dia<input type="number" step="0.5" min="0.5" name="bloco" value="${m.bloco}"></label>
    <div class="grupo-dia">Assuntos e horas de estudo</div>
    <div id="assuntos">${m.assuntos.map(linhaAssunto).join('')}</div>
    <button type="button" class="btn peq" data-a="addAssunto" style="margin-bottom:12px">+ Assunto</button>
    <div id="previa-meta"></div>
    <div class="linha-btns"><button class="btn" type="submit" style="flex:1">Calcular distribuição</button></div>
  </form>`);
}
function lerMeta(f) {
  const d = dadosForm(f); const nomes = [...f.querySelectorAll('[name=an]')].map(x => x.value.trim()); const hs = [...f.querySelectorAll('[name=ah]')].map(x => num(x.value));
  const assuntos = nomes.map((n, i) => ({ nome: n, horas: hs[i] })).filter(a => a.nome && a.horas > 0);
  return { id: f.dataset.id || uid(), nome: d.nome.trim(), dataProva: d.dataProva, inicio: d.inicio, bloco: Math.max(0.5, num(d.bloco) || 2), area: 'estudo', assuntos };
}
function distribuirMeta(meta, excluirIds) {
  const ini = meta.inicio < hoje() ? hoje() : meta.inicio; const fim = addDias(meta.dataProva, -1);
  if (fim < ini) return { erro: 'A prova precisa ser pelo menos um dia depois do início dos estudos.' };
  if (!meta.assuntos.length) return { erro: 'Informe pelo menos um assunto com horas.' };
  const livre = livreMapa(ini, fim, excluirIds); const dias = Object.keys(livre).sort();
  const totalLivre = dias.reduce((s, d) => s + Math.max(0, fl(livre[d])), 0);
  const rest = meta.assuntos.map(a => num(a.horas)); const total = rest.reduce((s, x) => s + x, 0);
  const plano = []; let ptr = 0; const n = rest.length;
  const passada = r => {
    for (const d of dias) {
      const cap = Math.min(fl(Math.max(0, livre[d])), ce(Math.max(0, livre[d]) * r)); let usado = 0; const hojeUsados = new Set();
      while (true) {
        if (!rest.some(x => x > 1e-9)) break;
        let k = -1;
        for (let j = 0; j < n; j++) { const c = (ptr + j) % n; if (rest[c] > 1e-9 && !hojeUsados.has(c)) { k = c; break; } }
        if (k < 0) for (let j = 0; j < n; j++) { const c = (ptr + j) % n; if (rest[c] > 1e-9) { k = c; break; } }
        const esp = cap - usado; if (esp < Math.min(0.5, rest[k]) - 1e-9) break;
        const ja = plano.filter(p => p.d === d && p.k === k).reduce((s, p) => s + p.h, 0);
        const blk = Math.min(meta.bloco - ja, rest[k], esp >= 0.5 ? fl(esp) : esp);
        if (blk <= 1e-9) { hojeUsados.add(k); if ([...Array(n).keys()].every(c => rest[c] <= 1e-9 || hojeUsados.has(c))) break; continue; }
        plano.push({ d, k, h: blk }); rest[k] -= blk; usado += blk; hojeUsados.add(k); ptr = k + 1;
      }
      livre[d] -= usado;
    }
  };
  passada(total >= totalLivre ? 1 : total / totalLivre);
  if (rest.some(x => x > 1e-9)) passada(1);
  // junta blocos do mesmo assunto no mesmo dia
  const j = {}; for (const p of plano) { const ch = p.d + '|' + p.k; j[ch] = j[ch] ? { ...j[ch], h: j[ch].h + p.h } : { ...p }; }
  const final = Object.values(j).sort((a, b) => a.d.localeCompare(b.d) || a.k - b.k);
  return { plano: final, falta: rest.reduce((s, x) => s + Math.max(0, x), 0), total, totalLivre, ini, fim };
}
function previaMeta(f) {
  const meta = lerMeta(f); const ex = new Set(S.db.itens.filter(i => i.metaId === meta.id && !i.feito).map(i => i.id));
  const r = distribuirMeta(meta, ex); const box = $('#previa-meta');
  if (r.erro) { box.innerHTML = `<div class="alerta verm">${r.erro}</div>`; return; }
  S.tmp.meta = { meta, r, ex };
  const porDia = {}; for (const p of r.plano) (porDia[p.d] || (porDia[p.d] = [])).push(p);
  box.innerHTML = `<div class="alerta ${r.falta > 1e-9 ? 'verm' : 'verde'}">${r.falta > 1e-9 ? `<b>Não cabe tudo antes da prova.</b> Faltam ${fh(r.falta)} — você tem ${fh(r.totalLivre)} livres de ${fdm(r.ini)} a ${fdm(r.fim)} e precisa de ${fh(r.total)}. Aumente as horas de alguns dias, comece antes ou reduza as horas dos assuntos.` : `Cabe! ${fh(r.total)} de estudo distribuídas em ${Object.keys(porDia).length} dia(s), com ${fh(r.totalLivre - r.total)} de sobra.`}</div>
  <table class="tab" style="margin-bottom:12px"><tr><th>Dia</th><th>Estudar</th></tr>${Object.entries(porDia).map(([d, ps]) => `<tr><td style="white-space:nowrap"><b>${fdia(d)}</b></td><td>${ps.map(p => `${esc(meta.assuntos[p.k].nome)} (${fh(p.h)})`).join(' · ')}</td></tr>`).join('')}</table>
  ${r.plano.length ? `<button type="button" class="btn pri bloco" data-a="confirmarMeta" style="margin-bottom:10px">Confirmar e criar ${r.plano.length} sessões de estudo</button>` : ''}`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function confirmarMeta() {
  const { meta, r, ex } = S.tmp.meta; if (!r) return;
  const antigos = [...ex]; if (antigos.length) excluir('itens', antigos);
  const existente = S.db.metas.find(m => m.id === meta.id);
  salvar('metas', { ...(existente || {}), ...meta, criado: existente?.criado || new Date().toISOString() }, true);
  const novos = r.plano.map(p => ({ id: uid(), titulo: `${meta.assuntos[p.k].nome} — ${meta.nome}`, tipo: 'tarefa', area: 'estudo', prioridade: 'alta', data: addDias(meta.dataProva, -1), planejado: p.d === addDias(meta.dataProva, -1) ? null : p.d, horas: p.h, repeticao: 'nenhuma', metaId: meta.id, assunto: meta.assuntos[p.k].nome, criado: new Date().toISOString(), historico: [], checklist: [] }));
  if (!S.db.itens.some(i => i.metaId === meta.id && i.provaDe)) novos.push({ id: uid(), titulo: `Prova: ${meta.nome}`, tipo: 'compromisso', area: 'estudo', prioridade: 'alta', data: meta.dataProva, horas: 0, repeticao: 'nenhuma', avisoAntes: 3, metaId: meta.id, provaDe: true, criado: new Date().toISOString(), historico: [], checklist: [] });
  else { const pv = S.db.itens.find(i => i.metaId === meta.id && i.provaDe); salvar('itens', { ...pv, data: meta.dataProva, titulo: `Prova: ${meta.nome}` }, true); }
  salvarVarios('itens', novos); fecharModal(); S.view = 'metas'; render(); toast('Plano de estudo criado!');
}

function redistMeta(id) {
  const m = S.db.metas.find(x => x.id === id);
  const pend = S.db.itens.filter(i => i.metaId === id && !i.feito && !i.provaDe);
  const assuntos = m.assuntos.map(a => ({ nome: a.nome, horas: pend.filter(i => i.assunto === a.nome).reduce((s, i) => s + num(i.horas), 0) })).filter(a => a.horas > 0);
  novaMeta({ ...m, inicio: hoje(), assuntos: assuntos.length ? assuntos : [{}] });
}

/* ---------- Resumo da semana ---------- */
VIEWS.resumo = () => {
  const ini = segundaDe(S.semanaRef), fim = addDias(ini, 6); const h = hoje();
  const its = itensVis(); const dentro = d => d && d >= ini && d <= fim;
  const feitos = its.filter(i => i.feito && dentro(i.diaFeito || (i.feitoEm || '').slice(0, 10)));
  const adiados = its.filter(i => (i.historico || []).some(x => dentro(x.em) && (x.tipo === 'adiado' || x.tipo === 'nao-consegui' || x.tipo === 'replanejado') && x.para > (x.de || '')));
  const planejadosSet = new Map();
  for (const i of its) { if (!num(i.horas)) continue; if (dentro(dia(i))) planejadosSet.set(i.id, i); if ((i.historico || []).some(x => dentro(x.de))) planejadosSet.set(i.id, i); }
  const hPlan = [...planejadosSet.values()].reduce((s, i) => s + num(i.horas), 0);
  const hReal = feitos.reduce((s, i) => s + num(i.horasReais ?? i.horas), 0);
  const pend = its.filter(i => !i.feito && dentro(dia(i)) && dia(i) <= h);
  let dispSem = 0; for (let d = ini; d <= fim; d = addDias(d, 1)) dispSem += disponivel(d);
  const porArea = {}; for (const i of feitos) porArea[i.area] = (porArea[i.area] || 0) + num(i.horasReais ?? i.horas);
  const taxa = feitos.length + pend.length ? Math.round(feitos.length / (feitos.length + pend.length) * 100) : 0;
  let html = `<h2 class="tit">Resumo da semana <span class="sub">${nomeAba()}</span></h2>
  <div class="cal-top"><button class="icone-btn" data-a="semNav" data-v="-7">‹</button><div class="mes">${fdm(ini)} – ${fdm(fim)}</div><button class="icone-btn" data-a="semNav" data-v="7">›</button></div>
  <div class="kpis"><div class="kpi"><div class="v" style="color:var(--verde)">${feitos.length}</div><div class="l">feitos</div></div><div class="kpi"><div class="v" style="color:var(--amar)">${adiados.length}</div><div class="l">adiados / replanejados</div></div>
  <div class="kpi"><div class="v">${fh(hReal)} <small style="font-size:.9rem;color:var(--txt2)">/ ${fh(hPlan)}</small></div><div class="l">realizadas / planejadas</div></div><div class="kpi"><div class="v">${taxa}%</div><div class="l">do que venceu foi feito</div></div></div>
  <div class="card"><h3>Horas por dia</h3><table class="tab"><tr><th>Dia</th><th class="num">Disponível</th><th class="num">Planejado</th><th class="num">Realizado</th></tr>`;
  for (let d = ini; d <= fim; d = addDias(d, 1)) {
    const p = its.filter(i => num(i.horas) && dia(i) === d).reduce((s, i) => s + num(i.horas), 0);
    const r = feitos.filter(i => (i.diaFeito || (i.feitoEm || '').slice(0, 10)) === d).reduce((s, i) => s + num(i.horasReais ?? i.horas), 0);
    html += `<tr><td>${fdia(d)}</td><td class="num">${fh(disponivel(d))}</td><td class="num" style="color:${p > disponivel(d) + 1e-9 ? 'var(--verm)' : 'inherit'}">${fh(p)}</td><td class="num">${fh(r)}</td></tr>`;
  }
  html += `<tr><th>Total</th><th class="num">${fh(dispSem)}</th><th class="num">${fh(hPlan)}</th><th class="num">${fh(hReal)}</th></tr></table></div>`;
  if (Object.keys(porArea).length) html += `<div class="card"><h3>Horas realizadas por área</h3>${Object.entries(porArea).map(([a, v]) => `<div class="det-linha"><span style="flex:1">${AREAS[a] || a}</span><b>${fh(v)}</b></div>`).join('')}</div>`;
  html += `<div class="grade2"><div class="card"><h3>O que fiz <span class="cont">${feitos.length}</span></h3>${lista(feitos)}</div>
  <div class="card"><h3>O que adiei <span class="cont">${adiados.length}</span></h3>${adiados.length ? adiados.map(i => cardItem(i, { mostrarData: true })).join('') : '<div class="vazio">Nada adiado.</div>'}</div></div>
  ${pend.length ? `<div class="card secao-atrasado"><h3>Ficou pendente <span class="cont">${pend.length}</span></h3>${lista(pend, { mostrarData: true })}</div>` : ''}`;
  return html;
};

    <label class="campo oculto" data-q="mes">Mês<input type="month" name="mes" value="${g.data ? g.data.slice(0, 7) : ''}"></label>
    <div class="campo"><span style="font-size:.88rem;font-weight:600;color:var(--txt2)">Repetição</span>${chips('repeticao', REPS_G, g.repeticao || 'unico')}</div>
    <div class="campo"><span style="font-size:.88rem;font-weight:600;color:var(--txt2)">Área</span>${chips('aba', { pessoal: 'Pessoal', trabalho: 'Trabalho' }, g.aba || 'pessoal')}</div>
    <label class="campo">Ligar a uma tarefa ou prazo<select name="itemId">${opcoesSel(its, g.itemId)}</select></label>
    <label class="campo">Observação<textarea name="obs" rows="2">${esc(g.obs || '')}</textarea></label>
    <div class="linha-btns"><button class="btn pri" type="submit" style="flex:1">Salvar</button>${novo ? '' : `<button class="btn perigo" type="button" data-a="excluirGasto" data-id="${g.id}">Excluir</button>`}</div></form>`);
  ajustarFormGasto();
}
function ajustarFormGasto() {
  const f = document.querySelector('form[data-form=gasto]'); if (!f) return;
  const q = f.querySelector('input[name=quando]:checked').value;
  f.querySelectorAll('[data-q]').forEach(el => el.classList.toggle('oculto', el.dataset.q !== q));
}
function verGasto(id) {
  const g = S.db.gastos.find(x => x.id === id); if (!g) return;
  const prox = ocorrenciasGastos(addDias(hoje(), -60), addMeses(hoje(), 13), true).filter(o => o.g.id === id).slice(0, 6);
  const it = S.db.itens.find(i => i.id === g.itemId);
  abrirModal(`${cab('💰 ' + esc(g.nome))}
    <div class="det-linha">Valor estimado <b>${g.valor ? brl(g.valor) : '—'}</b></div><div class="det-linha">Repetição <b>${REPS_G[g.repeticao || 'unico']}</b></div>
    <div class="det-linha">Área <b>${g.aba === 'trabalho' ? 'Trabalho' : 'Pessoal'}</b></div>
    ${it ? `<div class="det-linha">Ligado a <b><a href="#" data-a="verItem" data-id="${it.id}">${esc(it.titulo)}</a></b></div>` : ''}
    ${g.obs ? `<div class="alerta info" style="white-space:pre-wrap">${esc(g.obs)}</div>` : ''}
    <div class="grupo-dia" style="margin-top:12px">Ocorrências</div>
    ${prox.map(o => `<div class="check-linha ${o.pago ? 'ok' : ''}"><span class="txt">${rotuloGasto(o)}${o.pago ? ' — pago ' + brl(o.real) : ''}</span>${o.pago ? `<button class="btn peq" data-a="desfazerPago" data-id="${id}" data-d="${o.d}">Desfazer</button>` : `<button class="btn ok peq" data-a="pagar" data-id="${id}" data-d="${o.d}">Marcar pago</button>`}</div>`).join('') || '<div class="vazio">Sem ocorrências próximas.</div>'}
    <div class="linha-btns" style="margin-top:14px"><button class="btn" style="flex:1" data-a="editarGasto" data-id="${id}">Editar</button><button class="btn perigo" data-a="excluirGasto" data-id="${id}">Excluir</button></div>`);
}
function pagar(id, d) {
  const g = S.db.gastos.find(x => x.id === id);
  abrirModal(`${cab('Marcar como pago')}<p style="margin-top:0">${esc(g.nome)} · ${g.soMes ? nomeMes(mesDe(d)) : fdata(d)}</p>
    <form data-form="pagar" data-id="${id}" data-d="${d}"><label class="campo">Valor real pago<input name="v" type="number" step="0.01" min="0" inputmode="decimal" required value="${g.valor ?? ''}" autofocus></label>
    ${g.valor ? `<p class="vazio">Estimado: ${brl(g.valor)}</p>` : ''}<button class="btn pri bloco" type="submit">Confirmar pagamento</button></form>`);
}

/* ===================== Ações (cliques) ===================== */
const ACOES = {
  fechar: () => fecharModal(),
  verRoteiro: () => abrirModal(cab('Meu dia') + postitHtml(hoje())),
  editarRoteiro: el => editarRoteiro(el.dataset.v),
  addRot: () => $('#rot-linhas').insertAdjacentHTML('beforeend', linhaRot()),
  remRot: el => el.closest('.rot-linha').remove(),
  rotPadrao: el => { const a = AJ(); const rd = { ...(a.rotinaDia || {}) }; delete rd[el.dataset.v]; salvar('ajustes', { ...a, rotinaDia: rd }); fecharModal(); toast('Voltou ao roteiro padrão.'); },
  aba: el => { S.aba = el.dataset.v; ls.set('ag_aba', S.aba); render(); },
  ir: el => { S.view = el.dataset.v; fecharModal(); render(); scrollTo(0, 0); },
  tema: () => { const atual = document.documentElement.dataset.tema; ls.set('ag_tema', atual === 'escuro' ? 'claro' : 'escuro'); aplicarTema(); render(); },
  temaSet: el => { ls.set('ag_tema', el.dataset.v); aplicarTema(); render(); },
  novo: el => {
    const v = S.view;
    if (el.classList.contains('fab')) {
      if (v === 'notas') return formNota(); if (v === 'contatos') return formContato(); if (v === 'projetos') return formProjeto();
      if (v === 'gastos') return formGasto(); if (v === 'metas') return novaMeta();
      if (v === 'projeto') return formItem(null, { projeto: S.tmp.projetoId });
      if (v === 'agenda') return formItem(null, { dia: S.cal.sel });
    }
    formItem(null, { dia: el.dataset.dia, projeto: el.dataset.projeto, contato: el.dataset.contato, tipo: el.dataset.tipo });
  },
  feito: el => { const it = S.db.itens.find(x => x.id === el.dataset.id); marcarFeito(it.id, !it.feito); },
  feitoFechar: el => { fecharModal(); marcarFeito(el.dataset.id, true); },
  desfeito: el => { fecharModal(); marcarFeito(el.dataset.id, false); },
  verItem: el => verItem(el.dataset.id),
  editarItem: el => formItem(S.db.itens.find(x => x.id === el.dataset.id)),
  excluirItem: el => { if (confirm('Excluir este item?')) { excluir('itens', el.dataset.id); fecharModal(); } },
  chk: el => { const it = S.db.itens.find(x => x.id === el.dataset.id); const cl = it.checklist.map((c, i) => i === +el.dataset.i ? { ...c, ok: el.checked } : c); salvar('itens', { ...it, checklist: cl }, true); el.closest('.check-linha').classList.toggle('ok', el.checked); render(); },
  adiar: el => adiar(el.dataset.id),
  adiarPara: el => aplicarAdiar(el.dataset.id, el.dataset.v),
  naoConsegui: el => naoConsegui(el.dataset.id),
  moverPara: el => { const it = S.db.itens.find(x => x.id === el.dataset.id); const h = { ...it, historico: [...(it.historico || [])] }; moverOuPlanejarNC(h, el.dataset.v); fecharModal(); render(); toast(`Movido para ${frel(el.dataset.v)}.`); },
  aplicarDivisao: el => aplicarDivisao(el.dataset.id),
  revisao: () => { S.view = 'revisao'; fecharModal(); render(); scrollTo(0, 0); },
  replanejarTudo: () => previaLote(pendentesRevisao(), addDias(hoje(), 1), 'Replanejar pendentes', 'Cada item vai para o primeiro dia a partir de amanhã que tem espaço, sem passar do prazo.'),
  encaixar: () => previaLote(itensVis().filter(it => !it.feito && (it.tipo === 'tarefa' || it.tipo === 'prazo') && num(it.horas) > 0 && !it.planejado && (!it.data || it.data >= hoje())), hoje(), 'Planejar automaticamente', 'Cada tarefa vai para o primeiro dia a partir de hoje com espaço livre, antes do prazo.'),
  aplicarLote: () => aplicarLote(),
  diaPlan: (el, e) => { e.preventDefault(); diaPlan(el.dataset.v); },
  horasDia: el => horasDia(el.dataset.v),
  removerExc: el => { const a = AJ(); const ex = { ...a.excecoes }; delete ex[el.dataset.v]; const exd = { ...(a.excDetalhe || {}) }; delete exd[el.dataset.v]; salvar('ajustes', { ...a, excecoes: ex, excDetalhe: exd }); fecharModal(); toast('Dia voltou ao padrão.'); },
  calNav: el => { const n = +el.dataset.v; S.cal.ref = S.cal.modo === 'mes' ? addMeses(S.cal.ref.slice(0, 7) + '-01', n) : addDias(S.cal.ref, 7 * n); S.cal.sel = S.cal.modo === 'mes' ? (mesDe(hoje()) === mesDe(S.cal.ref) ? hoje() : S.cal.ref) : segundaDe(S.cal.ref); render(); },
  calModo: el => { S.cal.modo = el.dataset.v; S.cal.ref = S.cal.sel; render(); },
  calHoje: () => { S.cal.ref = hoje(); S.cal.sel = hoje(); render(); },
  calSel: el => { S.cal.sel = el.dataset.v; if (S.cal.modo === 'mes' && mesDe(el.dataset.v) !== mesDe(S.cal.ref)) S.cal.ref = el.dataset.v; render(); },
  semNav: el => { S.semanaRef = addDias(S.semanaRef, +el.dataset.v); render(); },
  novaMeta: () => novaMeta(),
  addAssunto: () => $('#assuntos').insertAdjacentHTML('beforeend', linhaAssunto()),
  remAssunto: el => el.closest('.assunto-linha').remove(),
  confirmarMeta: () => confirmarMeta(),
  redistMeta: el => redistMeta(el.dataset.id),
  excluirMeta: el => { if (!confirm('Excluir a meta e as sessões de estudo ainda não feitas?')) return; excluir('itens', S.db.itens.filter(i => i.metaId === el.dataset.id && !i.feito).map(i => i.id)); excluir('metas', el.dataset.id); },
  novaNota: el => formNota(null, { dia: el.dataset.dia, projeto: el.dataset.projeto, contato: el.dataset.contato }),
  verNota: el => verNota(el.dataset.id),
  editarNota: el => formNota(S.db.notas.find(x => x.id === el.dataset.id)),
  excluirNota: el => { if (confirm('Excluir esta nota?')) { excluir('notas', el.dataset.id); fecharModal(); } },
  novoContato: () => formContato(),
  verContato: el => verContato(el.dataset.id),
  editarContato: el => formContato(contato(el.dataset.id)),
  excluirContato: el => { if (confirm('Excluir este contato?')) { excluir('contatos', el.dataset.id); fecharModal(); } },
  novoProjeto: () => formProjeto(),
  verProjeto: el => { S.tmp.projetoId = el.dataset.id; S.view = 'projeto'; render(); scrollTo(0, 0); },
  abrirProjeto: (el, e) => { e.preventDefault(); fecharModal(); S.tmp.projetoId = el.dataset.id; S.view = 'projeto'; render(); },
  editarProjeto: el => formProjeto(projeto(el.dataset.id)),
  excluirProjeto: el => { if (confirm('Excluir o projeto? (as tarefas e notas continuam, só perdem o vínculo)')) { excluir('projetos', el.dataset.id); fecharModal(); S.view = 'projetos'; render(); } },
  novoGasto: () => formGasto(),
  verGasto: (el, e) => { e.preventDefault(); verGasto(el.dataset.id); },
  editarGasto: el => formGasto(S.db.gastos.find(x => x.id === el.dataset.id)),
  excluirGasto: el => { if (confirm('Excluir este gasto previsto?')) { excluir('gastos', el.dataset.id); fecharModal(); } },
  pagar: el => pagar(el.dataset.id, el.dataset.d),
  desfazerPago: el => { const g = S.db.gastos.find(x => x.id === el.dataset.id); const pg = { ...(g.pagamentos || {}) }; delete pg[el.dataset.d]; salvar('gastos', { ...g, pagamentos: pg }); fecharModal(); },
  rolarMes: el => document.getElementById('mes-' + el.dataset.v)?.scrollIntoView({ behavior: 'smooth' }),
  backup: () => { const b = new Blob([JSON.stringify({ exportado: new Date().toISOString(), ...S.db }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `agenda-backup-${hoje()}.json`; a.click(); },
  sair: () => { if (confirm('Sair deste aparelho? Vai precisar digitar o código de novo.')) sair(); }
};
function moverOuPlanejarNC(it, d) {
  if ((it.tipo === 'tarefa' || it.tipo === 'prazo') && it.data && d <= it.data) {
    salvar('itens', { ...it, planejado: d === it.data ? null : d, historico: [...(it.historico || []), { de: dia(it), para: d, em: hoje(), tipo: 'nao-consegui' }], adiamentos: (it.adiamentos || 0) + 1 }, true);
  } else moverItem(it, d, 'nao-consegui');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { ACOES[el.dataset.a]?.(el, e); return; }
  if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href') !== '#') return; // links normais (WhatsApp)
  if (el.tagName === 'A') e.preventDefault();
  ACOES[el.dataset.a]?.(el, e);
});
document.addEventListener('change', e => {
  if (e.target.closest('form[data-form=item]') && (e.target.name === 'tipo' || e.target.name === 'area')) ajustarFormItem();
  if (e.target.closest('form[data-form=gasto]') && e.target.name === 'quando') ajustarFormGasto();
  if (e.target.dataset?.copiar && e.target.value !== '') { const a = AJ(); const r = ((a.rotina || {})[e.target.value] || []); if (!r.length) { toast('Esse dia ainda não tem roteiro.'); e.target.value = ''; return; } $('#rot-linhas').innerHTML = r.map(linhaRot).join(''); toast('Copiado de ' + DSEM_LONGO[e.target.value].toLowerCase()); e.target.value = ''; }
});
document.addEventListener('input', e => {
  const fc = e.target.closest?.('form[data-calc]'); if (fc) { atualizarCalc(fc); return; }
  const k = e.target.dataset?.busca; if (!k) return;
  S.busca[k] = e.target.value; const pos = e.target.selectionStart; render();
  const novo = document.querySelector(`[data-busca=${k}]`); if (novo) { novo.focus(); try { novo.setSelectionRange(pos, pos); } catch {} }
});

/* ===================== Formulários (envio) ===================== */
const FORMS = {
  item: f => salvarFormItem(f),
  adiarData: f => { const d = dadosForm(f).d; if (d) aplicarAdiar(f.dataset.id, d); },
  horasReais: f => { const it = S.db.itens.find(x => x.id === f.dataset.id); salvar('itens', { ...it, horasReais: num(dadosForm(f).h) }); toast('Horas salvas'); verItem(it.id); },
  horas: f => { const d = dadosForm(f); const a = AJ(); const bl = DSEM.map((_, i) => lerBloco(d, 'd' + i)); salvar('ajustes', { ...a, semana: bl.map(b => b.livres), detalhe: bl.map(b => b.det), folga: Math.min(80, Math.max(0, num(d.folga))) }); toast('Horários salvos!'); },
  horasDia: f => { const a = AJ(); const r = lerBloco(dadosForm(f), 'x'); salvar('ajustes', { ...a, excecoes: { ...a.excecoes, [f.dataset.v]: r.livres }, excDetalhe: { ...(a.excDetalhe || {}), [f.dataset.v]: r.det } }); fecharModal(); toast(`Salvo: ${fh(r.livres)} livres neste dia`); },
  meta: f => previaMeta(f),
  roteiro: f => {
    const d = f.dataset.v; const hs = [...f.querySelectorAll('[name=rh]')].map(x => x.value); const ts = [...f.querySelectorAll('[name=rt]')].map(x => x.value.trim());
    const r = hs.map((hh, i) => ({ h: hh, t: ts[i] })).filter(x => x.h && x.t).sort((a, b) => a.h.localeCompare(b.h));
    const a = AJ(); const alc = dadosForm(f).alcance;
    if (alc === 'dia') salvar('ajustes', { ...a, rotinaDia: { ...(a.rotinaDia || {}), [d]: r } });
    else { const rd = { ...(a.rotinaDia || {}) }; delete rd[d]; salvar('ajustes', { ...a, rotina: { ...(a.rotina || {}), [dsem(d)]: r }, rotinaDia: rd }); }
    fecharModal(); toast(alc === 'dia' ? 'Roteiro salvo para ' + fdm(d) : 'Roteiro salvo para toda ' + DSEM_LONGO[dsem(d)].toLowerCase());
  },
  nota: f => { const d = dadosForm(f); const id = f.dataset.id; const ant = id ? S.db.notas.find(x => x.id === id) : null; salvar('notas', { ...(ant || { id: uid(), criado: new Date().toISOString() }), titulo: d.titulo.trim(), texto: d.texto, data: d.data || hoje(), aba: d.aba, projetoId: d.projetoId || null, contatoId: d.contatoId || null, dia: d.dia || null }); fecharModal(); toast('Nota salva'); },
  contato: f => { const d = dadosForm(f); const id = f.dataset.id; const ant = id ? contato(id) : null; salvar('contatos', { ...(ant || { id: uid() }), nome: d.nome.trim(), telefone: d.telefone.trim(), aba: d.aba, obs: d.obs }); fecharModal(); toast('Contato salvo'); },
  projeto: f => { const d = dadosForm(f); const id = f.dataset.id; const ant = id ? projeto(id) : null; salvar('projetos', { ...(ant || { id: uid(), criado: new Date().toISOString() }), nome: d.nome.trim(), status: d.status, obs: d.obs, aba: 'trabalho' }); fecharModal(); toast('Projeto salvo'); },
  gasto: f => {
    const d = dadosForm(f); const id = f.dataset.id; const ant = id ? S.db.gastos.find(x => x.id === id) : null;
    const soMes = d.quando === 'mes'; const data = soMes ? (d.mes ? d.mes + '-01' : '') : d.data;
    if (!data) { toast('Informe a data ou o mês.'); return; }
    salvar('gastos', { ...(ant || { id: uid(), pagamentos: {} }), nome: d.nome.trim(), valor: d.valor === '' ? null : num(d.valor), data, soMes, repeticao: d.repeticao, aba: d.aba, itemId: d.itemId || null, obs: d.obs });
    fecharModal(); toast('Gasto salvo');
  },
  pagar: f => { const g = S.db.gastos.find(x => x.id === f.dataset.id); salvar('gastos', { ...g, pagamentos: { ...(g.pagamentos || {}), [f.dataset.d]: { valor: num(dadosForm(f).v), em: hoje() } } }); fecharModal(); toast('Marcado como pago'); },
  codigo: async f => {
    const d = dadosForm(f); if (d.novo !== d.novo2) return toast('Os novos códigos não são iguais.');
    try { await rpc('app_definir_codigo', { p_novo: d.novo, p_atual: d.atual }); S.codigo = d.novo.trim(); if (ls.get('ag_codigo')) ls.set('ag_codigo', S.codigo); else ss.set('ag_codigo', S.codigo); f.reset(); toast('Código trocado!'); }
    catch (e) { toast({ invalido: 'Código atual incorreto.', codigo_curto: 'Use pelo menos 6 caracteres.', bloqueado: 'Muitas tentativas. Espere 10 min.' }[e.codigo] || 'Erro ao trocar o código.'); }
  }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f);
});

// Atualiza a tela à meia-noite / ao voltar para o app
let ultimoDia = hoje();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.codigo) return;
  if (!fila.length) { try { await carregar(); } catch {} }
  if (hoje() !== ultimoDia) { ultimoDia = hoje(); S.cal.sel = hoje(); S.cal.ref = hoje(); }
  if ($('#modal').classList.contains('oculto')) render();
});

setInterval(() => {
  if (!S.codigo) return; atualizarAgora();
  if (S.view === 'inicio' && $('#modal').classList.contains('oculto') && !document.activeElement?.matches?.('input,textarea,select')) render();
}, 60000);
iniciar();
</script>
</body>
</html>
