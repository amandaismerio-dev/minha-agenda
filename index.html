<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Minha Agenda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c3aed'/%3E%3Crect x='14' y='18' width='36' height='32' rx='5' fill='white'/%3E%3Crect x='14' y='18' width='36' height='9' rx='4' fill='%23f39200'/%3E%3Ccircle cx='24' cy='37' r='3' fill='%237c3aed'/%3E%3Ccircle cx='34' cy='37' r='3' fill='%231b9ad6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --card2:#f0f1f6; --txt:#1c1d24; --txt2:#5d6070; --linha:#e3e5ee;
  --pessoal:#7c3aed; --pessoal-claro:#ede6fd; --trabalho:#1b9ad6; --trabalho-claro:#dff1fb;
  --tudo:#f39200; --tudo-claro:#fdf0dc;
  --verm:#dc2626; --verm-claro:#fde8e8; --verde:#16a34a; --verde-claro:#e3f6e9; --amar:#d97706; --amar-claro:#fdf3dc;
  --acento:var(--pessoal); --acento-claro:var(--pessoal-claro);
  --raio:14px; --sombra:0 1px 2px rgba(20,20,40,.06),0 4px 14px rgba(20,20,40,.05);
  color-scheme:light;
}
:root[data-tema="escuro"]{
  --bg:#111218; --card:#1b1c24; --card2:#24252f; --txt:#ecedf3; --txt2:#a0a3b4; --linha:#30323e;
  --pessoal:#a78bfa; --pessoal-claro:#2c2442; --trabalho:#4cb8ec; --trabalho-claro:#16303f;
  --tudo:#f7a733; --tudo-claro:#3a2a12;
  --verm:#f87171; --verm-claro:#3d1d1f; --verde:#4ade80; --verde-claro:#163222; --amar:#fbbf24; --amar-claro:#3a2e12;
  --sombra:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
body[data-aba="trabalho"]{--acento:var(--trabalho);--acento-claro:var(--trabalho-claro)}
body[data-aba="tudo"]{--acento:var(--tudo);--acento-claro:var(--tudo-claro)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acento)}
.oculto{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--card);border-radius:20px;box-shadow:var(--sombra);padding:32px 24px;width:100%;max-width:380px;text-align:center}
.login-box h1{font-size:1.5rem;margin:12px 0 4px}
.login-box p{color:var(--txt2);margin:0 0 20px}
.logo{width:64px;height:64px;margin:0 auto;border-radius:16px;background:linear-gradient(135deg,var(--pessoal),var(--trabalho));display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}

/* ---------- Layout ---------- */
header.topo{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--linha);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header.topo h1{font-size:1.1rem;margin:0;font-weight:700;white-space:nowrap}
.abas{display:flex;background:var(--card2);border-radius:999px;padding:4px;gap:2px;margin-left:auto}
.abas button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--txt2);min-height:38px}
.abas button.ativo[data-v="pessoal"]{background:var(--pessoal);color:#fff}
.abas button.ativo[data-v="trabalho"]{background:var(--trabalho);color:#fff}
.abas button.ativo[data-v="tudo"]{background:var(--tudo);color:#fff}
.icone-btn{border:0;background:var(--card2);width:40px;height:40px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px}
nav.menu{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
nav.menu button{border:0;background:transparent;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--txt2);padding:6px 0;cursor:pointer;min-height:52px;border-radius:12px}
nav.menu button svg{width:24px;height:24px}
nav.menu button.ativo{color:var(--acento);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;width:60px;height:60px;border-radius:50%;border:0;background:var(--acento);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;line-height:1}
@media (min-width:900px){
  nav.menu{top:61px;bottom:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--linha);padding:12px}
  nav.menu button{flex:none;flex-direction:row;gap:10px;font-size:.95rem;padding:10px 12px;justify-content:flex-start;min-height:44px}
  nav.menu button.ativo{background:var(--acento-claro)}
  main{margin-left:200px;padding:24px 28px 60px;max-width:1100px}
  .fab{bottom:28px;right:28px}
}

/* ---------- Componentes ---------- */
h2.tit{font-size:1.35rem;margin:4px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2.tit .sub{font-size:.9rem;font-weight:500;color:var(--txt2)}
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:1rem;display:flex;align-items:center;gap:8px}
.card h3 .cont{margin-left:auto;font-size:.8rem;background:var(--card2);color:var(--txt2);padding:2px 9px;border-radius:999px;font-weight:600}
.secao-atrasado{border-left:5px solid var(--verm)}
.secao-atrasado h3{color:var(--verm)}
.secao-hoje{border-left:5px solid var(--acento)}
.secao-aviso{border-left:5px solid var(--amar)}
.vazio{color:var(--txt2);font-size:.92rem;padding:6px 2px}
.grade2{display:grid;gap:14px}
@media (min-width:900px){.grade2{grid-template-columns:1fr 1fr}}

.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--txt)}
.btn.pri{background:var(--acento);color:#fff}
.btn.perigo{background:var(--verm-claro);color:var(--verm)}
.btn.ok{background:var(--verde-claro);color:var(--verde)}
.btn.wa{background:#25d366;color:#fff}
.btn.peq{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.bloco{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.linha-btns{display:flex;flex-wrap:wrap;gap:8px}
.linha-btns.col{flex-direction:column}

/* Itens */
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item .chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--txt2);background:transparent;cursor:pointer;padding:0}
.item.ab-pessoal .chk{border-color:var(--pessoal)}
.item.ab-trabalho .chk{border-color:var(--trabalho)}
.item.feito .chk{background:var(--verde);border-color:var(--verde)}
.item.feito .chk::after{content:"✓";color:#fff;font-weight:700}
.item.feito .item-tit{text-decoration:line-through;color:var(--txt2)}
.item-corpo{flex:1;min-width:0;cursor:pointer}
.item-tit{font-weight:600;overflow-wrap:anywhere}
.item-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--txt2);margin-top:2px}
.item-meta .atras{color:var(--verm);font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--txt2)}
.tag.pessoal{background:var(--pessoal-claro);color:var(--pessoal)}
.tag.trabalho{background:var(--trabalho-claro);color:var(--trabalho)}
.pd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pd-alta{background:var(--verm)} .pd-media{background:var(--amar)} .pd-baixa{background:var(--verde)}
.item .mini-wa{flex:none;background:#25d366;color:#fff;border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:700;text-decoration:none}
.grupo-dia{font-size:.8rem;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 2px}
.grupo-dia:first-child{margin-top:0}

/* Barra de horas */
.barra-wrap{margin:6px 0 2px}
.barra{height:12px;border-radius:999px;background:var(--card2);overflow:hidden;display:flex;position:relative}
.barra span{height:100%}
.barra .seg-pessoal{background:var(--pessoal)} .barra .seg-trabalho{background:var(--trabalho)}
.barra.cheia{outline:2px solid var(--verm)}
.barra .marca{position:absolute;top:0;bottom:0;width:2px;background:var(--verm)}
.barra-txt{font-size:.78rem;color:var(--txt2);display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.barra-txt .over{color:var(--verm);font-weight:700}
.dia-plan{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--linha);cursor:pointer}
.dia-plan:last-child{border-bottom:0}
.dia-plan .dn{font-weight:700;font-size:.9rem}
.dia-plan .dn small{display:block;color:var(--txt2);font-weight:500}
.dia-plan.hoje .dn{color:var(--acento)}
.dia-plan.excedido .dn{color:var(--verm)}

/* Calendário */
.cal-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-top .mes{font-weight:700;font-size:1.1rem;text-transform:capitalize;flex:1;text-align:center}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--txt2);min-height:36px}
.seg button.ativo{background:var(--card);color:var(--txt);box-shadow:var(--sombra)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cab{text-align:center;font-size:.75rem;color:var(--txt2);font-weight:700;padding:4px 0}
.cal .d{background:var(--card);border-radius:10px;min-height:56px;padding:5px 4px;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal .d.fora{opacity:.4}
.cal .d.hoje .n{background:var(--acento);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.cal .d.sel{border-color:var(--acento)}
.cal .d.cheio{background:var(--verm-claro)}
.cal .n{font-weight:600;font-size:.9rem;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bolinhas{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:44px}
.bol{width:7px;height:7px;border-radius:50%}
.bol.pessoal{background:var(--pessoal)} .bol.trabalho{background:var(--trabalho)} .bol.gasto{background:var(--tudo)} .bol.atr{background:var(--verm)}
.semana{display:grid;gap:8px}
@media (min-width:900px){.semana{grid-template-columns:repeat(7,minmax(0,1fr))}}
.semana .col{background:var(--card);border-radius:12px;padding:8px;box-shadow:var(--sombra);min-height:80px;cursor:pointer}
.semana .col.hoje{outline:2px solid var(--acento)}
.semana .col .cn{font-weight:700;font-size:.85rem;margin-bottom:4px}
.semana .mini{font-size:.8rem;padding:3px 6px;border-radius:6px;margin-top:3px;background:var(--card2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--txt2)}
.semana .mini.pessoal{border-left-color:var(--pessoal)} .semana .mini.trabalho{border-left-color:var(--trabalho)} .semana .mini.feito{text-decoration:line-through;opacity:.6}

/* Modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,20,.5);display:flex;align-items:flex-end;justify-content:center}
#modal .folha{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:sobe .18s ease-out}
@media (min-width:700px){#modal{align-items:center}#modal .folha{border-radius:20px}}
@keyframes sobe{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.folha-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.folha-cab h2{margin:0;font-size:1.2rem;flex:1}
label.campo{display:block;margin-bottom:12px;font-size:.88rem;font-weight:600;color:var(--txt2)}
label.campo input,label.campo select,label.campo textarea,.inp{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--linha);background:var(--bg);color:var(--txt);font-weight:400;font-size:1rem;min-height:46px}
textarea{resize:vertical;min-height:90px}
.campos2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips input{display:none}
.chips label{padding:8px 13px;border-radius:999px;background:var(--card2);cursor:pointer;font-weight:600;font-size:.88rem;color:var(--txt);min-height:38px;display:inline-flex;align-items:center}
.chips input:checked+span{color:#fff}
.chips label:has(input:checked){background:var(--acento);color:#fff}
.check-linha{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha)}
.check-linha input[type=checkbox]{width:22px;height:22px;flex:none}
.check-linha .txt{flex:1}
.check-linha.ok .txt{text-decoration:line-through;color:var(--txt2)}
.det-linha{display:flex;gap:8px;font-size:.92rem;padding:4px 0;color:var(--txt2)}
.det-linha b{color:var(--txt);font-weight:600}
.alerta{border-radius:12px;padding:12px;margin:10px 0;font-size:.92rem}
.alerta.verm{background:var(--verm-claro);color:var(--verm)}
.alerta.amar{background:var(--amar-claro);color:var(--amar)}
.alerta.verde{background:var(--verde-claro);color:var(--verde)}
.alerta.info{background:var(--acento-claro);color:var(--txt)}
.sug{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--linha);border-radius:12px;margin-bottom:8px}
.sug .info{flex:1}
.sug .info small{display:block;color:var(--txt2)}
table.tab{width:100%;border-collapse:collapse;font-size:.9rem}
table.tab td,table.tab th{padding:7px 4px;border-bottom:1px solid var(--linha);text-align:left}
table.tab th{color:var(--txt2);font-size:.78rem;text-transform:uppercase}
.num{text-align:right!important;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border-radius:var(--raio);padding:12px;box-shadow:var(--sombra)}
.kpi .v{font-size:1.5rem;font-weight:800}
.kpi .l{font-size:.8rem;color:var(--txt2)}
.meses{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.meses .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
.meses .m .b{width:100%;background:var(--acento-claro);border-radius:6px 6px 0 0;min-height:3px}
.meses .m.pesado .b{background:var(--tudo)}
.meses .m .r{font-size:.66rem;color:var(--txt2);margin-top:4px;text-transform:capitalize}
.meses .m .val{font-size:.62rem;color:var(--txt2);margin-bottom:2px;white-space:nowrap}
.busca{margin-bottom:12px}
.lista-sel{display:flex;flex-direction:column}
.lista-sel .linha{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--linha);cursor:pointer}
.lista-sel .linha:last-child{border-bottom:0}
.lista-sel .linha .info{flex:1;min-width:0}
.lista-sel .linha small{color:var(--txt2);display:block}
.nota-txt{white-space:pre-wrap;color:var(--txt2);font-size:.9rem;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.assunto-linha{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;margin-bottom:8px}
.bloco-dia{border:1px solid var(--linha);border-radius:12px;padding:10px 12px 0;margin-bottom:8px}
.bd-nome{font-weight:700;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bd-res{background:var(--verde-claro);color:var(--verde);font-size:.85rem;padding:2px 10px;border-radius:999px}
.bd-campos{display:grid;grid-template-columns:1.15fr 1.15fr .8fr;gap:8px;align-items:end}
.bd-campos .campo{margin-bottom:10px;font-size:.8rem}
.bd-campos input{padding:9px 8px!important;min-height:42px!important}
.postit{background:#fff4a3;color:#3d3300;border-radius:4px 4px 14px 4px;padding:14px 16px 10px;margin-bottom:14px;box-shadow:0 2px 0 rgba(0,0,0,.06),0 8px 18px rgba(120,100,0,.15);position:relative}
:root[data-tema="escuro"] .postit{background:#3b3512;color:#fff1a6;box-shadow:none}
.postit::before{content:"";position:absolute;top:-7px;left:50%;width:70px;height:16px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.55);border-radius:2px}
:root[data-tema="escuro"] .postit::before{background:rgba(255,255,255,.12)}
.postit h3{margin:0 0 8px;font-size:1rem;display:flex;align-items:center;gap:8px}
.postit .pl{display:flex;gap:12px;padding:5px 6px;border-radius:8px;align-items:baseline}
.postit .pl .ph{font-weight:800;min-width:48px;font-variant-numeric:tabular-nums}
.postit .pl.passou{opacity:.5}
.postit .pl.agora{background:rgba(0,0,0,.08);font-weight:700}
:root[data-tema="escuro"] .postit .pl.agora{background:rgba(255,255,255,.12)}
.postit .pl.agora .ph::after{content:" ● agora";font-size:.7rem;color:#c2410c;font-weight:700;white-space:nowrap}
.postit .pbtn{border:0;background:rgba(0,0,0,.08);color:inherit;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;font-size:.85rem;min-height:36px}
:root[data-tema="escuro"] .postit .pbtn{background:rgba(255,255,255,.12)}
#agora{position:fixed;left:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:21;background:#fff4a3;color:#3d3300;border:0;border-radius:12px;padding:9px 13px;font-weight:700;font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:calc(100vw - 110px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left}
:root[data-tema="escuro"] #agora{background:#3b3512;color:#fff1a6}
@media (min-width:900px){#agora{left:216px;bottom:28px}}
.rot-linha{display:grid;grid-template-columns:124px 1fr 44px;gap:8px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-size:.92rem;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#sync{font-size:.75rem;color:var(--txt2)}
.mais-grade{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.mais-grade{grid-template-columns:repeat(3,1fr)}}
.mais-grade button{background:var(--card);border:0;border-radius:var(--raio);box-shadow:var(--sombra);padding:18px 12px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px}
.mais-grade button span{font-size:1.6rem}
.mais-grade button small{font-weight:500;color:var(--txt2);font-size:.78rem}
@media (max-width:420px){
  header.topo h1{display:none}
  .abas{margin-left:0}
  .abas button{padding:8px 11px}
}
</style>
</head>
<body data-aba="pessoal">

<!-- ===================== TELA DE ACESSO ===================== -->
<section id="login">
  <div class="login-box">
    <div class="logo">✓</div>
    <h1>Minha Agenda</h1>
    <p id="login-msg">Digite seu código de acesso</p>

<script>
/* =====================================================================
   CONFIGURAÇÃO — só estes dois valores ligam o site ao seu Supabase.
   A chave "publishable" é PÚBLICA por natureza: ela sozinha não lê
   nem grava nada. Todo acesso exige o código, que fica só no banco
   (guardado como hash bcrypt) e nunca aparece neste arquivo.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://gczedrtmorahvtfsrrki.supabase.co',
  SUPABASE_KEY: 'sb_publishable_8DavIjm6E2egTz0qtxuQRQ_f-WFPOXo'
};

/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const isoDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const hoje = () => isoDe(new Date());
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoDe(d); };
const addMeses = (s, n) => {
  const d = parse(s); const dia = d.getDate();
  const alvo = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const ult = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
  alvo.setDate(Math.min(dia, ult)); return isoDe(alvo);
};
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // dias de a até b
const dsem = s => (parse(s).getDay() + 6) % 7; // 0 = segunda ... 6 = domingo
const DSEM = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const DSEM_LONGO = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fdm = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '';
const fdata = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '';
const fdia = s => `${DSEM[dsem(s)]} ${fdm(s)}`;
const frel = s => { const n = diff(hoje(), s); if (n === 0) return 'hoje'; if (n === 1) return 'amanhã'; if (n === -1) return 'ontem'; return fdia(s); };
const fh = h => (Math.round((+h || 0) * 10) / 10).toLocaleString('pt-BR') + 'h';
const brl = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const segundaDe = s => addDias(s, -dsem(s));
const mesDe = s => s.slice(0, 7);
const nomeMes = ym => { const [y, m] = ym.split('-').map(Number); return `${MESES[m - 1]} ${y}`; };
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('oculto');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('oculto'), ms);
}

/* ===================== Banco (Supabase via funções RPC) ===================== */
const TABELAS = ['itens', 'contatos', 'projetos', 'notas', 'gastos', 'metas', 'ajustes'];
async function rpc(fn, args = {}) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'apikey': CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error('Falha de conexão (' + r.status + ')');
  const j = await r.json();
  if (j && j.erro) { const e = new Error(j.erro); e.codigo = j.erro; throw e; }
  return j;
}

const S = {
  codigo: null,
  db: Object.fromEntries(TABELAS.map(t => [t, []])),
  aba: ls.get('ag_aba') || 'pessoal',
  view: 'inicio',
  cal: { modo: 'mes', ref: hoje(), sel: hoje() },
  semanaRef: hoje(),
  busca: { notas: '', contatos: '', historico: '' },
  tmp: {}
};

let fila = []; let enviando = false;
function salvar(tab, obj, silencioso) {
  const arr = S.db[tab]; const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  fila.push({ op: 'g', tab, obj: JSON.parse(JSON.stringify(obj)) });
  if (!silencioso) render();
  enviar();
}
function salvarVarios(tab, objs) { objs.forEach(o => salvar(tab, o, true)); render(); }
function excluir(tab, id) {
  const ids = Array.isArray(id) ? id : [id];
  S.db[tab] = S.db[tab].filter(x => !ids.includes(x.id));
  fila.push({ op: 'x', tab, ids }); render(); enviar();
}
async function enviar() {
  if (enviando || !fila.length) return; enviando = true; mostrarSync('Salvando…');
  try {
    while (fila.length) {
      const p = fila[0];
      if (p.op === 'g') {
        // junta gravações seguidas da mesma tabela num só envio
        const lote = []; while (fila.length && fila[0].op === 'g' && fila[0].tab === p.tab && lote.length < 200) lote.push(fila.shift().obj);
        const mapa = new Map(lote.map(o => [o.id, o]));
        try { await rpc('app_gravar_varios', { p_codigo: S.codigo, p_tabela: p.tab, p_registros: [...mapa.values()].map(o => { const { id, ...dados } = o; return { id, dados }; }) }); }
        catch (e) { fila.unshift(...lote.map(obj => ({ op: 'g', tab: p.tab, obj }))); throw e; }
      } else {
        await rpc('app_excluir_varios', { p_codigo: S.codigo, p_tabela: p.tab, p_ids: p.ids }); fila.shift();
      }
    }
    mostrarSync('');
  } catch (e) {
    if (e.codigo === 'invalido' || e.codigo === 'sem_codigo') { sair(); return; }
    mostrarSync('⚠ Sem conexão — tentando de novo…');
    setTimeout(() => { enviando = false; enviar(); }, 8000); return;
  }
  enviando = false;
}
function mostrarSync(t) { const el = $('#sync'); if (el) el.textContent = t; }
window.addEventListener('beforeunload', e => { if (fila.length) { e.preventDefault(); e.returnValue = ''; } });

async function carregar() {
  const j = await rpc('app_listar_tudo', { p_codigo: S.codigo });
  for (const t of TABELAS) S.db[t] = (j.tabelas[t] || []).map(r => ({ id: r.id, ...r.dados }));
}

/* ===================== Acesso ===================== */
let primeiraVez = false;
async function iniciar() {
  aplicarTema();
  const salvo = ls.get('ag_codigo') || ss.get('ag_codigo');
  if (salvo) {
    S.codigo = salvo;
    try { await carregar(); abrirApp(); return; }
    catch (e) { if (e.codigo !== 'invalido' && e.codigo !== 'sem_codigo') { $('#login-erro').textContent = 'Sem conexão com o banco. Verifique a internet.'; } ls.del('ag_codigo'); ss.del('ag_codigo'); S.codigo = null; }
  }
  try {
    const st = await rpc('app_status');
    if (!st.codigo_definido) {
      primeiraVez = true;
      $('#login-msg').textContent = 'Primeiro acesso: crie seu código (mínimo 6 caracteres)';
      $('#inp-codigo2').classList.remove('oculto'); $('#btn-entrar').textContent = 'Criar código';
    }
  } catch { $('#login-erro').textContent = 'Não consegui falar com o banco. Confira a internet e a configuração.'; }
  $('#inp-codigo').focus();
}
$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const c = $('#inp-codigo').value.trim(); const err = $('#login-erro'); err.textContent = '';
  const btn = $('#btn-entrar'); btn.disabled = true;
  try {
    if (primeiraVez) {
      if (c.length < 6) throw { codigo: 'codigo_curto' };
      if (c !== $('#inp-codigo2').value.trim()) throw { codigo: 'diferente' };
      await rpc('app_definir_codigo', { p_novo: c });
    }
    await rpc('app_verificar', { p_codigo: c });
    S.codigo = c;
    if ($('#inp-lembrar').checked) ls.set('ag_codigo', c); else ss.set('ag_codigo', c);
    await carregar(); abrirApp();
  } catch (ex) {
    const m = { invalido: 'Código incorreto.', bloqueado: 'Muitas tentativas erradas. Espere 10 minutos.', codigo_curto: 'Use pelo menos 6 caracteres.', diferente: 'Os dois códigos não são iguais.' };
    err.textContent = m[ex.codigo] || 'Sem conexão. Tente de novo.';
  } finally { btn.disabled = false; }
});
function abrirApp() {
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  $('#inp-codigo').value = '';
  render();
}
function sair() {
  ls.del('ag_codigo'); ss.del('ag_codigo'); S.codigo = null;
  location.reload();
}

/* ===================== Tema ===================== */
function aplicarTema() {
  const t = ls.get('ag_tema') || 'auto';
  const escuro = t === 'escuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', aplicarTema);

/* ===================== Modelo: itens ===================== */
const TIPOS = {
  tarefa: { n: 'Tarefa', i: '☑' },
  prazo: { n: 'Prazo', i: '⚑' },
  mensagem: { n: 'Mensagem', i: '💬' },
  compromisso: { n: 'Compromisso', i: '🕑' }
};
const AREAS = { estudo: 'Estudo', casa: 'Casa', pessoal: 'Pessoal', trabalho: 'Trabalho' };
const PRIOS = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };
const REPS = { nenhuma: 'Não repete', diaria: 'Diária', semanal: 'Semanal', mensal: 'Mensal' };
const PESO_PRIO = { alta: 0, media: 1, baixa: 2 };

const abaDe = it => (it.area === 'trabalho' ? 'trabalho' : 'pessoal');
const visivel = obj => S.aba === 'tudo' || (obj.aba ? (obj.aba === S.aba || obj.aba === 'ambos') : abaDe(obj) === S.aba);
const dia = it => it.planejado || it.data || null; // dia em que o item "acontece"/será feito
const prazoDe = it => it.data || null;
const itensVis = () => S.db.itens.filter(visivel);
const atrasado = it => { const h = hoje(); return !it.feito && ((dia(it) && dia(it) < h) || (it.data && it.data < h)); };
const proxRep = (s, rep) => rep === 'diaria' ? addDias(s, 1) : rep === 'semanal' ? addDias(s, 7) : rep === 'mensal' ? addMeses(s, 1) : null;

// ocorrências de um item num intervalo (itens repetidos aparecem em todos os dias da série)
function ocorr(it, ini, fim) {
  const base = dia(it); if (!base) return [];
  if (!it.repeticao || it.repeticao === 'nenhuma' || it.feito) return (base >= ini && base <= fim) ? [base] : [];
  const r = []; let d = base, n = 0;
  while (d <= fim && n < 800) { if (d >= ini) r.push(d); d = proxRep(d, it.repeticao); n++; }
  return r;
}

function marcarFeito(id, feito = true) {
  const it = S.db.itens.find(x => x.id === id); if (!it) return;
  if (feito) {
    const novo = { ...it, feito: true, feitoEm: new Date().toISOString(), diaFeito: hoje() };
    if (novo.horasReais == null) novo.horasReais = num(it.horas);
    salvar('itens', novo, true);
    if (it.repeticao && it.repeticao !== 'nenhuma') criarProxima(it);
    toast('Feito! Foi para o histórico.');
  } else {
    salvar('itens', { ...it, feito: false, feitoEm: null, diaFeito: null }, true);
  }
  render();
}
function criarProxima(it) {
  if (!dia(it)) return;
  const prox = { ...it, id: uid(), feito: false, feitoEm: null, diaFeito: null, horasReais: null, historico: [], serie: it.serie || it.id, adiamentos: 0 };
  // avança quantas repetições forem necessárias até cair depois de hoje
  let k = 1, ref = proxRep(dia(it), it.repeticao);
  while (ref <= hoje() && k < 1000) { ref = proxRep(ref, it.repeticao); k++; }
  const avanca = s => { let x = s; for (let i = 0; i < k; i++) x = proxRep(x, it.repeticao); return x; };
  if (it.data) prox.data = avanca(it.data);
  if (it.planejado) prox.planejado = avanca(it.planejado);
  if (prox.checklist) prox.checklist = prox.checklist.map(c => ({ ...c, ok: false }));
  // a série continua só no item novo
  salvar('itens', { ...S.db.itens.find(x => x.id === it.id), repeticao: 'nenhuma', serie: prox.serie }, true);
  salvar('itens', prox, true);
}

function moverItem(it, novoDia, motivo = 'adiado') {
  const de = dia(it);
  const n = { ...it, historico: [...(it.historico || []), { de, para: novoDia, em: hoje(), tipo: motivo }] };
  // se tem "fazer em" separado do prazo, move só o planejamento; senão move a data
  if (it.planejado) n.planejado = novoDia;
  else if (it.tipo === 'tarefa' && it.data && novoDia <= it.data) n.planejado = novoDia; // mantém o prazo, muda o dia de fazer
  else n.data = novoDia;
  n.adiamentos = (it.adiamentos || 0) + 1;
  salvar('itens', n, true);
}

/* ===================== Contatos / WhatsApp ===================== */
function waNumero(tel) {
  let d = String(tel || '').replace(/\D/g, '');
  if (d.startsWith('0')) d = d.replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
const waLink = (tel, txt) => `https://wa.me/${waNumero(tel)}${txt ? '?text=' + encodeURIComponent(txt) : ''}`;
const contato = id => S.db.contatos.find(c => c.id === id);
const projeto = id => S.db.projetos.find(p => p.id === id);

/* ===================== Ajustes e capacidade ===================== */
function AJ() {
  const r = S.db.ajustes.find(x => x.id === 'geral') || {};
  return { semana: [3, 3, 3, 3, 3, 6, 4], folga: 20, excecoes: {}, ...r, id: 'geral' };
}
const horasLivres = s => { const a = AJ(); return a.excecoes[s] != null ? num(a.excecoes[s]) : num(a.semana[dsem(s)]); };
const disponivel = s => Math.max(0, horasLivres(s) * (1 - num(AJ().folga) / 100));

// carga (horas planejadas) por dia; itens feitos contam no dia em que foram feitos
function cargaMapa(ini, fim, excluirIds) {
  const m = {}; const ex = excluirIds || new Set();
  const add = (d, h, ab) => { const x = m[d] || (m[d] = { t: 0, pessoal: 0, trabalho: 0 }); x.t += h; x[ab] += h; };
  for (const it of S.db.itens) {
    if (ex.has(it.id)) continue; const h = num(it.horas); if (!h) continue;
    if (it.feito) { const d = it.diaFeito || (it.feitoEm || '').slice(0, 10); if (d >= ini && d <= fim) add(d, h, abaDe(it)); continue; }
    for (const d of ocorr(it, ini, fim)) add(d, h, abaDe(it));
  }
  return m;
}
function livreMapa(ini, fim, excluirIds) {
  const c = cargaMapa(ini, fim, excluirIds); const r = {};
  for (let d = ini; d <= fim; d = addDias(d, 1)) r[d] = disponivel(d) - (c[d]?.t || 0);
  return r;
}
function barraDia(s, carga) {
  const c = carga[s] || { t: 0, pessoal: 0, trabalho: 0 }; const disp = disponivel(s); const livres = horasLivres(s);
  const max = Math.max(disp, c.t, 0.01); const cheio = c.t > disp + 1e-9;
  const pw = (c.pessoal / max) * 100, tw = (c.trabalho / max) * 100;
  const marca = cheio ? `<i class="marca" style="left:${(disp / max) * 100}%"></i>` : '';
  return `<div class="barra-wrap"><div class="barra ${cheio ? 'cheia' : ''}"><span class="seg-pessoal" style="width:${pw}%"></span><span class="seg-trabalho" style="width:${tw}%"></span>${marca}</div>
    <div class="barra-txt"><span class="${cheio ? 'over' : ''}">${fh(c.t)} planejadas de ${fh(disp)}${cheio ? ' — passou ' + fh(c.t - disp) : ''}</span><span>${livres ? fh(livres) + ' livres' + (num(AJ().folga) ? ' − ' + num(AJ().folga) + '% reserva' : '') : 'dia sem horas livres'}</span></div></div>`;
}

/* ===================== Gastos previstos ===================== */
const REPS_G = { unico: 'Único', mensal: 'Mensal', semestral: 'Semestral', anual: 'Anual' };
const passoG = { mensal: 1, semestral: 6, anual: 12 };
function ocorrGasto(g, ini, fim) {
  if (!g.data) return [];
  if (!g.repeticao || g.repeticao === 'unico') return (g.data >= ini && g.data <= fim) ? [g.data] : [];
  const r = []; let d = g.data, n = 0;
  while (d <= fim && n < 400) { if (d >= ini) r.push(d); n++; d = addMeses(g.data, passoG[g.repeticao] * n); }
  return r;
}
function ocorrenciasGastos(ini, fim, todasAbas) {
  const r = [];
  for (const g of S.db.gastos) { if (!todasAbas && !visivel(g)) continue; for (const d of ocorrGasto(g, ini, fim)) { const pg = (g.pagamentos || {})[d]; r.push({ g, d, pago: !!pg, real: pg ? num(pg.valor) : null, valor: pg ? num(pg.valor) : num(g.valor) }); } }
  return r.sort((a, b) => a.d.localeCompare(b.d));
}
const rotuloGasto = (o) => o.g.soMes ? nomeMes(mesDe(o.d)) : fdata(o.d);

/* ===================== Renderização ===================== */
function render() {
  document.body.dataset.aba = S.aba;
  document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('ativo', b.dataset.v === S.aba));
  const mapaNav = { inicio: 'inicio', agenda: 'agenda', planejador: 'planejador', notas: 'notas' };
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('ativo', b.dataset.v === (mapaNav[S.view] || 'mais')));
  const cor = getComputedStyle(document.body).getPropertyValue('--acento').trim();
  document.querySelector('meta[name=theme-color]').content = cor || '#7c3aed';
  const V = VIEWS[S.view] || VIEWS.inicio;
  $('#main').innerHTML = V();
  atualizarAgora();
}
const nomeAba = () => ({ pessoal: 'Pessoal', trabalho: 'Trabalho', tudo: 'Tudo' }[S.aba]);

function cardItem(it, o = {}) {
  const ab = abaDe(it); const c = contato(it.contatoId); const p = projeto(it.projetoId);
  const meta = [];
  meta.push(`<span>${TIPOS[it.tipo]?.i || ''} ${TIPOS[it.tipo]?.n || ''}</span>`);
  if (S.aba === 'tudo') meta.push(`<span class="tag ${ab}">${ab === 'trabalho' ? 'Trabalho' : 'Pessoal'}</span>`);
  if (it.hora) meta.push(`<span>${esc(it.hora)}</span>`);
  if (!o.semData && it.data && (o.mostrarData || it.planejado)) meta.push(`<span class="${!it.feito && it.data < hoje() ? 'atras' : ''}">${it.tipo === 'tarefa' || it.tipo === 'prazo' ? 'prazo ' : ''}${frel(it.data)}</span>`);
  if (o.mostrarData && it.planejado && it.planejado !== it.data) meta.push(`<span class="${!it.feito && it.planejado < hoje() ? 'atras' : ''}">fazer ${frel(it.planejado)}</span>`);
  if (num(it.horas)) meta.push(`<span>${fh(it.horas)}</span>`);
  if (it.area && it.area !== 'trabalho' && it.area !== 'pessoal') meta.push(`<span>${AREAS[it.area]}</span>`);
  if (p) meta.push(`<span>◆ ${esc(p.nome)}</span>`);
  if (it.checklist?.length) meta.push(`<span>☑ ${it.checklist.filter(x => x.ok).length}/${it.checklist.length}</span>`);
  if (it.repeticao && it.repeticao !== 'nenhuma') meta.push(`<span>↻ ${REPS[it.repeticao]}</span>`);
  if (o.virtual) meta.push(`<span>↻ repetição</span>`);
  const wa = it.tipo === 'mensagem' && c && c.telefone && !it.feito ? `<a class="mini-wa" href="${waLink(c.telefone, it.mensagem)}" target="_blank" rel="noopener">WhatsApp</a>` : '';
  return `<div class="item ab-${ab} ${it.feito ? 'feito' : ''}">
    <button class="chk" data-a="feito" data-id="${it.id}" aria-label="Marcar como feito"></button>
    <div class="item-corpo" data-a="verItem" data-id="${it.id}">
      <div class="item-tit">${it.prioridade ? `<span class="pd pd-${it.prioridade}"></span>` : ''}${esc(it.titulo)}${it.tipo === 'mensagem' && c ? ` <span style="font-weight:500;color:var(--txt2)">→ ${esc(c.nome)}</span>` : ''}</div>
      <div class="item-meta">${meta.join('')}</div>
    </div>${wa}
  </div>`;
}
const ordenar = arr => arr.sort((a, b) => (dia(a) || '9').localeCompare(dia(b) || '9') || (a.hora || '99').localeCompare(b.hora || '99') || (PESO_PRIO[a.prioridade] ?? 1) - (PESO_PRIO[b.prioridade] ?? 1));
const lista = (arr, o) => arr.length ? arr.map(it => cardItem(it, o)).join('') : `<div class="vazio">${o?.vazio || 'Nada por aqui.'}</div>`;

/* ---------- Roteiro do dia (post-it) ---------- */
const agoraHM = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); };
function roteiro(d) {
  const a = AJ(); const r = (a.rotinaDia || {})[d] ?? (a.rotina || {})[dsem(d)] ?? [];
  return r.filter(x => x.h && x.t).slice().sort((x, y) => x.h.localeCompare(y.h));
}
const roteiroProprio = d => (AJ().rotinaDia || {})[d] != null;
function idxAgora(r) { const n = agoraHM(); let k = -1; r.forEach((x, i) => { if (x.h <= n) k = i; }); return k; }
function postitHtml(d) {
  const r = roteiro(d); const ehHoje = d === hoje(); const k = ehHoje ? idxAgora(r) : -2;
  const tit = ehHoje ? 'Meu roteiro de hoje' : 'Roteiro de ' + fdia(d);
  if (!r.length) return `<div class="postit"><h3>🗒 ${tit}</h3><div style="font-size:.92rem;margin-bottom:8px">Monte o seu dia hora a hora (ex.: 7h acordar, 8h trabalho, 12h almoço, 18h estudo). Ele fica aqui para você lembrar.</div><button class="pbtn" data-a="editarRoteiro" data-v="${d}">+ Montar roteiro</button></div>`;
  return `<div class="postit"><h3>🗒 ${tit}${roteiroProprio(d) ? ' <small style="font-weight:600;opacity:.7">(só deste dia)</small>' : ''}</h3>
    ${r.map((x, i) => `<div class="pl ${ehHoje && i < k ? 'passou' : ''} ${i === k ? 'agora' : ''}"><span class="ph">${x.h.replace(':00', 'h').replace(':', 'h')}</span><span>${esc(x.t)}</span></div>`).join('')}
    <div style="margin-top:8px"><button class="pbtn" data-a="editarRoteiro" data-v="${d}">Editar roteiro</button></div></div>`;
}
function atualizarAgora() {
  const el = $('#agora'); if (!el) return;
  const r = roteiro(hoje()); const k = idxAgora(r);
  if (!r.length || k < 0) { el.classList.add('oculto'); return; }
  const prox = r[k + 1];
  el.textContent = `🗒 Agora: ${r[k].t}${prox ? ' · ' + prox.h.replace(':00', 'h').replace(':', 'h') + ' ' + prox.t : ''}`;
  el.classList.remove('oculto');
}
function linhaRot(x = {}) { return `<div class="rot-linha"><input class="inp" type="time" name="rh" value="${x.h || ''}" style="margin:0"><input class="inp" name="rt" value="${esc(x.t || '')}" placeholder="O que fazer" style="margin:0"><button type="button" class="icone-btn" data-a="remRot" style="height:46px;width:44px" aria-label="Remover">✕</button></div>`; }
function editarRoteiro(d, base) {
  const r = base || roteiro(d); const nomeDs = DSEM_LONGO[dsem(d)].toLowerCase();
  const linhas = r.length ? r : [{ h: '07:00', t: 'Acordar' }, { h: '08:00', t: 'Trabalho' }, { h: '12:00', t: 'Almoço' }, { h: '13:00', t: '' }, { h: '18:00', t: 'Estudo' }];
  abrirModal(`${cab('🗒 Roteiro — ' + fdia(d))}
  <form data-form="roteiro" data-v="${d}">
    <p class="vazio" style="margin-top:-4px">Coloque o horário e o que vai fazer. A linha vale até o próximo horário.</p>
    <div id="rot-linhas">${linhas.map(linhaRot).join('')}</div>
    <div class="linha-btns" style="margin-bottom:12px"><button type="button" class="btn peq" data-a="addRot">+ Horário</button>
      <select class="inp" data-copiar="${d}" style="width:auto;flex:1;min-height:36px;padding:6px 10px;margin:0"><option value="">Copiar de outro dia…</option>${DSEM_LONGO.map((n, i) => `<option value="${i}">${n}</option>`).join('')}</select></div>
    <div class="campo"><span style="font-size:.88rem;font-weight:600;color:var(--txt2)">Usar este roteiro</span>${chips('alcance', { semana: 'Toda ' + nomeDs, dia: 'Só neste dia (' + fdm(d) + ')' }, roteiroProprio(d) ? 'dia' : 'semana')}</div>
    <div class="linha-btns"><button class="btn pri" type="submit" style="flex:1">Salvar</button>${roteiroProprio(d) ? `<button type="button" class="btn" data-a="rotPadrao" data-v="${d}">Voltar ao de toda ${nomeDs}</button>` : ''}</div>
  </form>`);
}

const VIEWS = {};

/* ---------- Avisos (tela inicial) ---------- */
VIEWS.inicio = () => {
  const h = hoje(), h7 = addDias(h, 7);
  const its = itensVis().filter(it => !it.feito);
  const atr = ordenar(its.filter(atrasado));
  const setA = new Set(atr.map(x => x.id));
  const deHoje = ordenar(its.filter(it => !setA.has(it.id) && (dia(it) === h || it.data === h)));
  const setH = new Set(deHoje.map(x => x.id));
  // próximos 7 dias (inclui repetições)
  const prox = [];
  for (const it of its) { if (setA.has(it.id) || setH.has(it.id)) continue; const oc = ocorr(it, addDias(h, 1), h7); if (oc.length) prox.push({ it, d: oc[0], virtual: oc[0] !== dia(it) }); else if (it.data && it.data > h && it.data <= h7) prox.push({ it, d: it.data }); }
  prox.sort((a, b) => a.d.localeCompare(b.d) || (a.it.hora || '99').localeCompare(b.it.hora || '99'));
  // avisos antecipados de prazos
  const antec = its.filter(it => it.data && num(it.avisoAntes) > 0 && diff(h, it.data) > 0 && diff(h, it.data) <= num(it.avisoAntes));
  const semData = its.filter(it => !dia(it));
  // gastos
  const ini = h.slice(0, 7) + '-01', fimMes = addDias(addMeses(ini, 1), -1);
  const gMes = ocorrenciasGastos(ini, fimMes);
  const g30 = ocorrenciasGastos(addDias(h, 1), addDias(h, 30)).filter(o => !o.pago);
  const c = cargaMapa(h, h);

  let html = `<h2 class="tit">Avisos <span class="sub">${DSEM_LONGO[dsem(h)]}, ${fdata(h)} · ${nomeAba()}</span> <span id="sync" style="margin-left:auto"></span></h2>`;
  html += postitHtml(h);
  if (antec.length || g30.length) {
    html += `<div class="card secao-aviso"><h3>⚠ Avisos antecipados</h3>`;
    html += antec.map(it => `<div class="alerta amar" data-a="verItem" data-id="${it.id}" style="cursor:pointer;margin:6px 0"><b>${esc(it.titulo)}</b> — prazo em ${diff(h, it.data)} dia(s) (${fdia(it.data)})</div>`).join('');
    html += g30.map(o => { const n = diff(h, o.d); return `<div class="alerta ${n <= 7 ? 'verm' : 'amar'}" data-a="verGasto" data-id="${o.g.id}" style="cursor:pointer;margin:6px 0">💰 <b>${esc(o.g.nome)}</b>${o.g.valor ? ' — ' + brl(o.g.valor) : ''} · ${n <= 7 ? 'em ' + n + ' dia(s)' : 'em ' + n + ' dias'} (${rotuloGasto(o)})</div>`; }).join('');
    html += `</div>`;
  }
  html += `<div class="card secao-atrasado"><h3>Atrasado <span class="cont">${atr.length}</span></h3>${lista(atr, { mostrarData: true, vazio: 'Nada atrasado. 👏' })}
    ${atr.length ? `<div class="linha-btns" style="margin-top:10px"><button class="btn peq" data-a="revisao">Replanejar atrasados</button></div>` : ''}</div>`;
  html += `<div class="card secao-hoje"><h3>Hoje <span class="cont">${deHoje.length}</span></h3>${barraDia(h, c)}<div style="margin-top:8px">${lista(deHoje, { vazio: 'Nada para hoje.' })}</div>
    <div class="linha-btns" style="margin-top:10px"><button class="btn peq" data-a="revisao">Revisão do fim do dia</button><button class="btn peq" data-a="novo" data-dia="${h}">+ Para hoje</button></div></div>`;
  html += `<div class="card"><h3>Próximos 7 dias <span class="cont">${prox.length}</span></h3>`;
  if (!prox.length) html += `<div class="vazio">Semana tranquila.</div>`;
  let ult = '';
  for (const p of prox) { if (p.d !== ult) { html += `<div class="grupo-dia">${frel(p.d)}${frel(p.d) !== fdia(p.d) ? ' · ' + fdia(p.d) : ''}</div>`; ult = p.d; } html += cardItem(p.it, { virtual: p.virtual }); }
  html += `</div>`;
  // gastos do mês
  const pend = gMes.filter(o => !o.pago);
  html += `<div class="card"><h3>💰 Gastos previstos de ${MESES[+h.slice(5, 7) - 1]} <span class="cont">${gMes.length}</span></h3>`;
  if (gMes.length) {
    html += `<div style="margin-bottom:8px">Este mês você tem <b>${gMes.length} gasto(s) previsto(s)</b> — total estimado <b>${brl(gMes.reduce((s, o) => s + o.valor, 0))}</b>${pend.length !== gMes.length ? ` (${gMes.length - pend.length} já pago(s))` : ''}.</div>`;
    html += `<div class="lista-sel">` + gMes.map(o => `<div class="linha" data-a="verGasto" data-id="${o.g.id}"><div class="info"><b style="${o.pago ? 'text-decoration:line-through;color:var(--txt2)' : ''}">${esc(o.g.nome)}</b><small>${rotuloGasto(o)}${o.pago ? ' · pago' : ''}</small></div><b>${o.valor ? brl(o.valor) : '—'}</b></div>`).join('') + `</div>`;
  } else html += `<div class="vazio">Nenhum gasto previsto para este mês.</div>`;
  html += `</div>`;
  if (semData.length) html += `<div class="card"><h3>Sem data <span class="cont">${semData.length}</span></h3>${lista(semData)}</div>`;
  return html;
};

/* ---------- Agenda (mês / semana) ---------- */
function itensDoDia(s) {
  const r = [];
  for (const it of itensVis()) {
    if (it.feito) { if ((it.diaFeito || dia(it)) === s) r.push({ it }); continue; }
    if (ocorr(it, s, s).length) r.push({ it, virtual: dia(it) !== s });
    else if (it.planejado && it.data === s) r.push({ it, prazoAqui: true });
  }
  return r.sort((a, b) => (a.it.hora || '99').localeCompare(b.it.hora || '99'));
}
VIEWS.agenda = () => {
  const { modo, ref, sel } = S.cal; const h = hoje();
  let ini, fim, titulo;
  if (modo === 'mes') { const p = ref.slice(0, 7) + '-01'; ini = segundaDe(p); const ultimo = addDias(addMeses(p, 1), -1); fim = addDias(segundaDe(ultimo), 6); titulo = nomeMes(ref.slice(0, 7)); }
  else { ini = segundaDe(ref); fim = addDias(ini, 6); titulo = `${fdm(ini)} – ${fdm(fim)}`; }
  // pré-calcula ocorrências
  const mapa = {}; const push = (d, x) => (mapa[d] || (mapa[d] = [])).push(x);
  for (const it of itensVis()) {
    if (it.feito) { const d = it.diaFeito || dia(it); if (d && d >= ini && d <= fim) push(d, { it }); continue; }
    for (const d of ocorr(it, ini, fim)) push(d, { it, virtual: d !== dia(it) });
  }
  const gastos = {}; for (const o of ocorrenciasGastos(ini, fim)) (gastos[o.d] || (gastos[o.d] = [])).push(o);
  const carga = cargaMapa(ini, fim);
  let html = `<h2 class="tit">Agenda <span class="sub">${nomeAba()}</span></h2>
  <div class="cal-top">
    <button class="icone-btn" data-a="calNav" data-v="-1" aria-label="Anterior">‹</button>
    <div class="mes">${titulo}</div>
    <button class="icone-btn" data-a="calNav" data-v="1" aria-label="Próximo">›</button>
  </div>
  <div class="cal-top"><div class="seg"><button class="${modo === 'mes' ? 'ativo' : ''}" data-a="calModo" data-v="mes">Mês</button><button class="${modo === 'semana' ? 'ativo' : ''}" data-a="calModo" data-v="semana">Semana</button></div>
  <button class="btn peq" data-a="calHoje" style="margin-left:auto">Hoje</button></div>`;
  if (modo === 'mes') {
    html += `<div class="cal">${DSEM.map(d => `<div class="cab">${d}</div>`).join('')}`;
    for (let d = ini; d <= fim; d = addDias(d, 1)) {
      const xs = mapa[d] || []; const gs = gastos[d] || [];
      const bol = xs.slice(0, 5).map(x => `<i class="bol ${atrasado(x.it) && !x.virtual ? 'atr' : abaDe(x.it)}"></i>`).join('') + (gs.length ? '<i class="bol gasto"></i>' : '');
      const cheio = (carga[d]?.t || 0) > disponivel(d) + 1e-9;
      html += `<div class="d ${d.slice(0, 7) !== ref.slice(0, 7) ? 'fora' : ''} ${d === h ? 'hoje' : ''} ${d === sel ? 'sel' : ''} ${cheio ? 'cheio' : ''}" data-a="calSel" data-v="${d}"><span class="n">${+d.slice(8)}</span><span class="bolinhas">${bol}</span></div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="semana">`;
    for (let d = ini; d <= fim; d = addDias(d, 1)) {
      const xs = mapa[d] || [];
      html += `<div class="col ${d === h ? 'hoje' : ''}" data-a="calSel" data-v="${d}"><div class="cn">${fdia(d)}</div>${barraMini(d, carga)}
      ${xs.map(x => `<div class="mini ${abaDe(x.it)} ${x.it.feito ? 'feito' : ''}">${x.it.hora ? esc(x.it.hora) + ' ' : ''}${esc(x.it.titulo)}</div>`).join('')}
      ${(gastos[d] || []).map(o => `<div class="mini" style="border-left-color:var(--tudo)">💰 ${esc(o.g.nome)}</div>`).join('')}</div>`;
    }
    html += `</div>`;
  }
  // dia selecionado
  const xs = itensDoDia(sel); const gs = ocorrenciasGastos(sel, sel);
  html += `<div class="card" style="margin-top:14px"><h3>${DSEM_LONGO[dsem(sel)]}, ${fdata(sel)} <span class="cont">${xs.length}</span></h3>${barraDia(sel, cargaMapa(sel, sel))}
    <div style="margin-top:8px">${xs.length ? xs.map(x => cardItem(x.it, { virtual: x.virtual, mostrarData: x.prazoAqui })).join('') : '<div class="vazio">Nenhum item neste dia.</div>'}</div>
    ${gs.map(o => `<div class="alerta amar" data-a="verGasto" data-id="${o.g.id}" style="cursor:pointer">💰 ${esc(o.g.nome)} ${o.valor ? '— ' + brl(o.valor) : ''}${o.pago ? ' (pago)' : ''}</div>`).join('')}
    <div class="linha-btns" style="margin-top:10px"><button class="btn peq pri" data-a="novo" data-dia="${sel}">+ Adicionar neste dia</button><button class="btn peq" data-a="novaNota" data-dia="${sel}">+ Nota do dia</button><button class="btn peq" data-a="horasDia" data-v="${sel}">Horas deste dia</button></div>
    ${notasDoDia(sel)}</div>${postitHtml(sel)}`;
  return html;
};
function barraMini(d, carga) {
  const c = carga[d]?.t || 0, disp = disponivel(d); const cheio = c > disp + 1e-9;
  const w = disp ? Math.min(100, (c / disp) * 100) : (c ? 100 : 0);
  return `<div class="barra ${cheio ? 'cheia' : ''}" style="height:6px;margin-bottom:4px"><span class="seg-pessoal" style="width:${w}%;background:${cheio ? 'var(--verm)' : 'var(--acento)'}"></span></div>`;
}
function notasDoDia(s) {
  const ns = S.db.notas.filter(n => n.dia === s && visivel(n)); if (!ns.length) return '';
  return `<div class="grupo-dia" style="margin-top:14px">Notas do dia</div>` + ns.map(n => `<div class="lista-sel"><div class="linha" data-a="verNota" data-id="${n.id}"><div class="info"><b>${esc(n.titulo || 'Sem título')}</b><div class="nota-txt">${esc(n.texto)}</div></div></div></div>`).join('');
}

};

/* ---------- Projetos ---------- */
VIEWS.projetos = () => {
  const ps = S.db.projetos.slice().sort((a, b) => (a.status === 'concluido') - (b.status === 'concluido') || a.nome.localeCompare(b.nome));
  return `<h2 class="tit">Projetos / usinas <span class="sub">Trabalho</span><button class="btn peq pri" data-a="novoProjeto" style="margin-left:auto">+ Projeto</button></h2>
  <div class="card"><div class="lista-sel">${ps.length ? ps.map(p => {
    const its = S.db.itens.filter(i => i.projetoId === p.id); const pend = its.filter(i => !i.feito);
    const prox = pend.filter(i => i.data).sort((a, b) => a.data.localeCompare(b.data))[0];
    return `<div class="linha" data-a="verProjeto" data-id="${p.id}"><div class="info"><b>${esc(p.nome)}</b><small>${p.status === 'concluido' ? 'Concluído' : 'Em andamento'} · ${pend.length} pendente(s)${prox ? ` · próximo prazo ${fdia(prox.data)}` : ''}</small></div><span>›</span></div>`;
  }).join('') : '<div class="vazio">Nenhum projeto. Crie um para cada usina/cliente.</div>'}</div></div>`;
};
VIEWS.projeto = () => {
  const p = projeto(S.tmp.projetoId); if (!p) { S.view = 'projetos'; return VIEWS.projetos(); }
  const its = ordenar(S.db.itens.filter(i => i.projetoId === p.id)); const ns = S.db.notas.filter(n => n.projetoId === p.id).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const gs = S.db.gastos.filter(g => g.projetoId === p.id);
  return `<h2 class="tit"><button class="icone-btn" data-a="ir" data-v="projetos">‹</button> ${esc(p.nome)} <button class="btn peq" data-a="editarProjeto" data-id="${p.id}" style="margin-left:auto">Editar</button></h2>
  ${p.obs ? `<div class="card" style="white-space:pre-wrap">${esc(p.obs)}</div>` : ''}
  <div class="card"><h3>Prazos e tarefas <span class="cont">${its.filter(i => !i.feito).length}</span></h3>${lista(its.filter(i => !i.feito), { mostrarData: true, vazio: 'Nada pendente.' })}
  <div class="linha-btns" style="margin-top:10px"><button class="btn peq pri" data-a="novo" data-projeto="${p.id}">+ Tarefa/prazo</button></div></div>
  <div class="card"><h3>Anotações <span class="cont">${ns.length}</span></h3><div class="lista-sel">${ns.map(n => `<div class="linha" data-a="verNota" data-id="${n.id}"><div class="info"><b>${esc(n.titulo || 'Sem título')}</b><small>${fdata(n.data)}</small><div class="nota-txt">${esc(n.texto)}</div></div></div>`).join('') || '<div class="vazio">Sem anotações.</div>'}</div>
  <div class="linha-btns" style="margin-top:10px"><button class="btn peq" data-a="novaNota" data-projeto="${p.id}">+ Anotação</button></div></div>
  ${gs.length ? `<div class="card"><h3>Gastos ligados</h3>${gs.map(g => `<div class="linha" data-a="verGasto" data-id="${g.id}" style="cursor:pointer;padding:6px 0">💰 ${esc(g.nome)} ${g.valor ? '— ' + brl(g.valor) : ''}</div>`).join('')}</div>` : ''}
  <div class="card"><h3>Concluídos <span class="cont">${its.filter(i => i.feito).length}</span></h3>${lista(its.filter(i => i.feito))}</div>`;
};

/* ---------- Notas ---------- */
VIEWS.notas = () => {
  const q = S.busca.notas.toLowerCase();
  const ns = S.db.notas.filter(n => visivel(n) && (!q || ((n.titulo || '') + ' ' + (n.texto || '') + ' ' + (projeto(n.projetoId)?.nome || '') + ' ' + (contato(n.contatoId)?.nome || '')).toLowerCase().includes(q)))
    .sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.criado || '').localeCompare(a.criado || ''));
  return `<h2 class="tit">Bloco de notas <span class="sub">${nomeAba()}</span><button class="btn peq pri" data-a="novaNota" style="margin-left:auto">+ Nota</button></h2>
  <input class="inp busca" placeholder="Buscar nas notas…" value="${esc(S.busca.notas)}" data-busca="notas">
  <div class="card"><div class="lista-sel">${ns.length ? ns.map(n => {
    const ligs = [projeto(n.projetoId) && '◆ ' + esc(projeto(n.projetoId).nome), contato(n.contatoId) && '👤 ' + esc(contato(n.contatoId).nome), n.dia && '📅 ' + fdm(n.dia)].filter(Boolean).join(' · ');
    return `<div class="linha" data-a="verNota" data-id="${n.id}"><div class="info"><b>${esc(n.titulo || 'Sem título')}</b><small>${fdata(n.data)}${ligs ? ' · ' + ligs : ''}</small><div class="nota-txt">${esc(n.texto)}</div></div></div>`;
  }).join('') : '<div class="vazio">Nenhuma nota encontrada.</div>'}</div></div>`;
};

/* ---------- Gastos previstos ---------- */
VIEWS.gastos = () => {
  const h = hoje(); const ini = h.slice(0, 7) + '-01'; const fim = addDias(addMeses(ini, 12), -1);
  const oc = ocorrenciasGastos(ini, fim);
  const meses = []; for (let i = 0; i < 12; i++) { const ym = mesDe(addMeses(ini, i)); meses.push({ ym, total: 0, itens: [] }); }
  for (const o of oc) { const m = meses.find(x => x.ym === mesDe(o.d)); if (m) { m.total += o.valor; m.itens.push(o); } }
  const max = Math.max(...meses.map(m => m.total), 1); const media = meses.reduce((s, m) => s + m.total, 0) / 12;
  const pesados = new Set(meses.filter(m => m.total > 0).sort((a, b) => b.total - a.total).slice(0, 3).filter(m => m.total >= media * 1.2).map(m => m.ym));
  const total12 = meses.reduce((s, m) => s + m.total, 0);
  let html = `<h2 class="tit">Gastos previstos <span class="sub">${nomeAba()} · lembretes, não é extrato</span><button class="btn peq pri" data-a="novoGasto" style="margin-left:auto">+ Gasto</button></h2>
  <div class="kpis"><div class="kpi"><div class="v">${brl(meses[0].total)}</div><div class="l">Este mês</div></div><div class="kpi"><div class="v">${brl(total12)}</div><div class="l">Próximos 12 meses</div></div>
  <div class="kpi"><div class="v">${brl(media)}</div><div class="l">Média por mês</div></div><div class="kpi"><div class="v">${pesados.size ? [...pesados].map(ym => MESES[+ym.slice(5) - 1].slice(0, 3)).join(', ') : '—'}</div><div class="l">Meses mais pesados</div></div></div>
  <div class="card"><h3>Próximos 12 meses</h3><div class="meses">${meses.map(m => `<div class="m ${pesados.has(m.ym) ? 'pesado' : ''}" data-a="rolarMes" data-v="${m.ym}" title="${nomeMes(m.ym)}: ${brl(m.total)}"><span class="val">${m.total ? Math.round(m.total / 100) / 10 + 'k' : ''}</span><div class="b" style="height:${(m.total / max) * 100}%"></div><span class="r">${MESES[+m.ym.slice(5) - 1].slice(0, 3)}</span></div>`).join('')}</div>
  <div class="barra-txt" style="margin-top:8px"><span>Laranja = meses mais pesados</span><span>valores em mil R$</span></div></div>`;
  for (const m of meses) {
    if (!m.itens.length) continue;
    html += `<div class="card" id="mes-${m.ym}"><h3 style="text-transform:capitalize">${nomeMes(m.ym)} ${pesados.has(m.ym) ? '<span class="tag" style="background:var(--tudo-claro);color:var(--tudo)">pesado</span>' : ''}<span class="cont">${brl(m.total)}</span></h3><div class="lista-sel">`;
    html += m.itens.map(o => `<div class="linha"><div class="info" data-a="verGasto" data-id="${o.g.id}"><b style="${o.pago ? 'text-decoration:line-through;color:var(--txt2)' : ''}">${esc(o.g.nome)}</b><small>${rotuloGasto(o)} · ${REPS_G[o.g.repeticao || 'unico']}${S.aba === 'tudo' ? ' · ' + (o.g.aba === 'trabalho' ? 'Trabalho' : 'Pessoal') : ''}${o.pago ? ` · pago ${brl(o.real)}${o.g.valor ? ` (previsto ${brl(o.g.valor)})` : ''}` : ''}</small></div>
      <b style="white-space:nowrap">${o.g.valor || o.pago ? brl(o.valor) : '—'}</b>
      ${o.pago ? `<button class="btn peq" data-a="desfazerPago" data-id="${o.g.id}" data-d="${o.d}">Desfazer</button>` : `<button class="btn peq ok" data-a="pagar" data-id="${o.g.id}" data-d="${o.d}">Pago</button>`}</div>`).join('');
    html += `</div></div>`;
  }
  if (!oc.length) html += `<div class="card vazio">Cadastre gastos que não acontecem todo mês: IPVA, IPTU, presentes, manutenção, cursos, inscrições…</div>`;
  // comparação estimado × real
  const pagos = []; for (const g of S.db.gastos.filter(visivel)) for (const [d, p] of Object.entries(g.pagamentos || {})) pagos.push({ g, d, p });
  if (pagos.length) {
    pagos.sort((a, b) => b.d.localeCompare(a.d));
    const te = pagos.reduce((s, x) => s + num(x.g.valor), 0), tr = pagos.reduce((s, x) => s + num(x.p.valor), 0);
    html += `<div class="card"><h3>Pagos: previsto × real</h3><table class="tab"><tr><th>Gasto</th><th>Data</th><th class="num">Previsto</th><th class="num">Real</th></tr>
    ${pagos.slice(0, 30).map(x => `<tr><td>${esc(x.g.nome)}</td><td>${fdm(x.d)}</td><td class="num">${x.g.valor ? brl(x.g.valor) : '—'}</td><td class="num" style="color:${num(x.p.valor) > num(x.g.valor) && x.g.valor ? 'var(--verm)' : 'inherit'}">${brl(x.p.valor)}</td></tr>`).join('')}
    <tr><th>Total</th><th></th><th class="num">${brl(te)}</th><th class="num">${brl(tr)}</th></tr></table></div>`;
  }
  return html;
};

/* ---------- Ajustes ---------- */
VIEWS.ajustes = () => {
  const a = AJ(); const t = ls.get('ag_tema') || 'auto';
  return `<h2 class="tit">Ajustes</h2>
  <div class="card"><h3>Meu dia a dia</h3>
    <p class="vazio" style="margin-top:-4px">Para cada dia, diga a que horas acorda, a que horas dorme e quantas horas já estão ocupadas (aula, trabalho, refeições, deslocamento…). O sistema calcula sozinho as <b>horas livres para tarefas</b>.</p>
    <form data-form="horas" data-calc>${DSEM_LONGO.map((d, i) => blocoDia('d' + i, detDia(i), d)).join('')}
    <label class="campo" style="margin-top:12px">Reserva para imprevistos (%) — deixe 0 se não quiser reserva<input type="number" min="0" max="80" step="5" name="folga" value="${a.folga}"></label>
    <button class="btn pri bloco" type="submit">Salvar meus horários</button></form>
    <p class="vazio" style="margin-top:10px">Para mudar só um dia específico (feriado, viagem, dia de prova), abra o dia na Agenda e toque em “Horas deste dia”.</p>
    ${excecoesHtml()}</div>
  <div class="card"><h3>Aparência</h3><div class="seg" style="display:inline-flex">${['auto', 'claro', 'escuro'].map(v => `<button class="${t === v ? 'ativo' : ''}" data-a="temaSet" data-v="${v}">${{ auto: 'Automático', claro: 'Claro', escuro: 'Escuro' }[v]}</button>`).join('')}</div></div>
  <div class="card"><h3>Código de acesso</h3>
    <form data-form="codigo"><label class="campo">Código atual<input type="password" name="atual" required></label>
    <label class="campo">Novo código (mín. 6)<input type="password" name="novo" required minlength="6"></label>
    <label class="campo">Repita o novo<input type="password" name="novo2" required minlength="6"></label>
    <button class="btn pri" type="submit">Trocar código</button></form></div>
  <div class="card"><h3>Dados</h3><div class="linha-btns"><button class="btn" data-a="backup">Baixar cópia (backup)</button><button class="btn perigo" data-a="sair">Sair deste aparelho</button></div>
  <p class="vazio" style="margin-top:8px">${S.db.itens.length} itens · ${S.db.notas.length} notas · ${S.db.contatos.length} contatos · ${S.db.gastos.length} gastos</p></div>`;
};
function excecoesHtml() {
  const a = AJ(); const ex = Object.entries(a.excecoes).filter(([d]) => d >= hoje()).sort();
  if (!ex.length) return '';
  return `<div class="grupo-dia" style="margin-top:14px">Dias ajustados</div>` + ex.map(([d, h]) => `<div class="check-linha"><span class="txt">${fdia(d)}/${d.slice(0, 4)} — ${fh(h)} livres (só nesse dia)</span><button class="btn peq" data-a="removerExc" data-v="${d}">Remover</button></div>`).join('');
}
</script>
<script>
/* ===================== Modal ===================== */
function abrirModal(html) { $('#folha').innerHTML = html; $('#modal').classList.remove('oculto'); document.body.style.overflow = 'hidden'; $('#folha').scrollTop = 0; }
function fecharModal() { $('#modal').classList.add('oculto'); $('#folha').innerHTML = ''; document.body.style.overflow = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('oculto')) fecharModal(); });
const cab = t => `<div class="folha-cab"><h2>${t}</h2><button class="icone-btn" data-a="fechar" aria-label="Fechar">✕</button></div>`;
const chips = (nome, opcoes, atual) => `<div class="chips">${Object.entries(opcoes).map(([v, n]) => `<label><input type="radio" name="${nome}" value="${v}" ${v === atual ? 'checked' : ''}>${n}</label>`).join('')}</div>`;
const opcoesSel = (arr, atual, vazio = '— nenhum —') => `<option value="">${vazio}</option>` + arr.map(([v, n]) => `<option value="${esc(v)}" ${v === atual ? 'selected' : ''}>${esc(n)}</option>`).join('');
const dadosForm = f => Object.fromEntries(new FormData(f).entries());

/* ===================== Formulário de item ===================== */
function formItem(it, pre = {}) {
  const novo = !it;
  it = it || { tipo: pre.tipo || 'tarefa', area: pre.area || (S.aba === 'trabalho' ? 'trabalho' : 'pessoal'), prioridade: 'media', repeticao: 'nenhuma', data: pre.dia || '', projetoId: pre.projeto || '', contatoId: pre.contato || '', avisoAntes: 0 };
  if (pre.projeto) it.area = 'trabalho';
  const cs = S.db.contatos.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(c => [c.id, c.nome]);
  const ps = S.db.projetos.filter(p => p.status !== 'concluido' || p.id === it.projetoId).map(p => [p.id, p.nome]);
  abrirModal(`${cab(novo ? 'Novo item' : 'Editar item')}
  <form data-form="item" data-id="${novo ? '' : it.id}">
    <label class="campo">Título<input name="titulo" required value="${esc(it.titulo || '')}" placeholder="Ex.: Usina X concluída, mandar mensagem para Fulano…" autofocus></label>
    <div class="campo"><span style="font-size:.88rem;font-weight:600;color:var(--txt2)">Tipo</span>${chips('tipo', Object.fromEntries(Object.entries(TIPOS).map(([k, v]) => [k, v.i + ' ' + v.n])), it.tipo)}</div>
    <div class="campo"><span style="font-size:.88rem;font-weight:600;color:var(--txt2)">Área</span>${chips('area', AREAS, it.area)}</div>
    <div class="campo"><span style="font-size:.88rem;font-weight:600;color:var(--txt2)">Prioridade</span>${chips('prioridade', PRIOS, it.prioridade || 'media')}</div>
    <div class="campos2">
      <label class="campo"><span data-rot="data">Data</span><input type="date" name="data" value="${it.data || ''}"></label>
      <label class="campo">Hora (opcional)<input type="time" name="hora" value="${it.hora || ''}"></label>
    </div>
    <div class="campos2" data-so="tarefa prazo compromisso">
      <label class="campo" data-so="tarefa prazo">Fazer em (dia planejado)<input type="date" name="planejado" value="${it.planejado || ''}"></label>
      <label class="campo">Tempo estimado (horas)<input type="number" step="0.25" min="0" name="horas" value="${it.horas ?? ''}" placeholder="Ex.: 1,5"></label>
    </div>
    <div class="campos2">
      <label class="campo">Repetição<select name="repeticao">${Object.entries(REPS).map(([k, v]) => `<option value="${k}" ${k === (it.repeticao || 'nenhuma') ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="campo" data-so="prazo tarefa">Aviso antecipado<select name="avisoAntes"><option value="0">Sem aviso</option><option value="1" ${+it.avisoAntes === 1 ? 'selected' : ''}>1 dia antes</option><option value="3" ${+it.avisoAntes === 3 ? 'selected' : ''}>3 dias antes</option></select></label>
    </div>
    <label class="campo">Contato<select name="contatoId">${opcoesSel(cs, it.contatoId)}</select></label>
    <label class="campo" data-so="mensagem">Texto da mensagem (opcional — já abre escrito no WhatsApp)<textarea name="mensagem" rows="2">${esc(it.mensagem || '')}</textarea></label>
    <label class="campo" data-area="trabalho">Projeto / usina<select name="projetoId">${opcoesSel(ps, it.projetoId)}</select></label>
    <label class="campo">Link (opcional)<input type="url" name="link" value="${esc(it.link || '')}" placeholder="https://…"></label>
    <label class="campo">Checklist (um item por linha)<textarea name="checklist" rows="3" placeholder="Ex.:&#10;Pedir material&#10;Agendar equipe">${esc((it.checklist || []).map(c => c.t).join('\n'))}</textarea></label>
    <label class="campo">Observação<textarea name="obs" rows="2">${esc(it.obs || '')}</textarea></label>
    <div class="linha-btns"><button class="btn pri" type="submit" style="flex:1">Salvar</button>${novo ? '' : `<button class="btn perigo" type="button" data-a="excluirItem" data-id="${it.id}">Excluir</button>`}</div>
  </form>`);
  ajustarFormItem();
}
function ajustarFormItem() {
  const f = document.querySelector('form[data-form=item]'); if (!f) return;
  const tipo = f.querySelector('input[name=tipo]:checked')?.value || 'tarefa';
  const area = f.querySelector('input[name=area]:checked')?.value;
  f.querySelectorAll('[data-so]').forEach(el => el.classList.toggle('oculto', !el.dataset.so.split(' ').includes(tipo)));
  f.querySelectorAll('[data-area]').forEach(el => el.classList.toggle('oculto', el.dataset.area !== area));
  f.querySelector('[data-rot=data]').textContent = { tarefa: 'Prazo (data limite, opcional)', prazo: 'Data do prazo', mensagem: 'Quando mandar', compromisso: 'Data' }[tipo];
}
function salvarFormItem(f) {
  const d = dadosForm(f); const id = f.dataset.id;
  const antigo = id ? S.db.itens.find(x => x.id === id) : null;
  const linhas = (d.checklist || '').split('\n').map(s => s.trim()).filter(Boolean);
  const velho = antigo?.checklist || [];
  const it = {
    ...(antigo || { id: uid(), criado: new Date().toISOString(), historico: [] }),
    titulo: d.titulo.trim(), tipo: d.tipo, area: d.area, prioridade: d.prioridade,
    data: d.data || null, hora: d.hora || null,
    planejado: (d.tipo === 'tarefa' || d.tipo === 'prazo') ? (d.planejado || null) : null,
    horas: d.tipo === 'mensagem' ? 0 : num(d.horas),
    repeticao: d.repeticao, avisoAntes: (d.tipo === 'prazo' || d.tipo === 'tarefa') ? +d.avisoAntes : 0,
    contatoId: d.contatoId || null, mensagem: d.tipo === 'mensagem' ? d.mensagem : (antigo?.mensagem || ''),
    projetoId: d.area === 'trabalho' ? (d.projetoId || null) : null,
    link: d.link || '', obs: d.obs || '',
    checklist: linhas.map(t => ({ t, ok: !!velho.find(c => c.t === t && c.ok) }))
  };
  if (it.planejado && it.planejado === it.data) it.planejado = null;
  salvar('itens', it); fecharModal(); toast('Salvo');
}

/* ===================== Detalhe do item ===================== */
function verItem(id) {
  const it = S.db.itens.find(x => x.id === id); if (!it) return;
  const c = contato(it.contatoId), p = projeto(it.projetoId); const ab = abaDe(it);
  const g = S.db.gastos.filter(x => x.itemId === it.id);
  const L = (r, v) => v ? `<div class="det-linha"><span style="min-width:110px">${r}</span><b>${v}</b></div>` : '';
  abrirModal(`${cab(esc(it.titulo))}
    <div style="margin:-6px 0 10px"><span class="tag ${ab}">${ab === 'trabalho' ? 'Trabalho' : 'Pessoal'}</span> <span class="tag">${TIPOS[it.tipo]?.n}</span> ${it.prioridade ? `<span class="tag"><span class="pd pd-${it.prioridade}"></span>${PRIOS[it.prioridade]}</span>` : ''} ${it.feito ? '<span class="tag" style="background:var(--verde-claro);color:var(--verde)">Feito</span>' : atrasado(it) ? '<span class="tag" style="background:var(--verm-claro);color:var(--verm)">Atrasado</span>' : ''}</div>
    ${L(it.tipo === 'tarefa' ? 'Prazo' : 'Data', it.data ? fdia(it.data) + '/' + it.data.slice(0, 4) + (it.hora ? ' às ' + esc(it.hora) : '') : '')}
    ${L('Fazer em', it.planejado ? fdia(it.planejado) : '')}
    ${L('Área', AREAS[it.area])}
    ${L('Tempo estimado', num(it.horas) ? fh(it.horas) : '')}
    ${L('Repetição', it.repeticao && it.repeticao !== 'nenhuma' ? REPS[it.repeticao] : '')}
    ${L('Aviso', num(it.avisoAntes) ? it.avisoAntes + ' dia(s) antes' : '')}
    ${L('Projeto', p ? `<a href="#" data-a="abrirProjeto" data-id="${p.id}">${esc(p.nome)}</a>` : '')}
    ${L('Contato', c ? esc(c.nome) + (c.telefone ? ' · ' + esc(c.telefone) : '') : '')}
    ${L('Link', it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.link.length > 40 ? it.link.slice(0, 40) + '…' : it.link)}</a>` : '')}
    ${L('Adiado', it.adiamentos ? it.adiamentos + ' vez(es)' : '')}
    ${L('Feito em', it.feito ? fdata(it.diaFeito || it.feitoEm?.slice(0, 10)) : '')}

/* ---------- Adiar ---------- */
function adiar(id) {

  const base = dia(it) && dia(it) > h ? dia(it) : h;

    <form data-form="adiarData" data-id="${id}" style="display:flex;gap:8px"><input class="inp" type="date" name="d" required min="${h}" style="flex:1;margin:0"><button class="btn" type="submit">Mover</button></form>
